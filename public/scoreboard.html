<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;800&display=swap" rel="stylesheet">
<style>
  /* Built for a portrait TV read from across the room: every size is a share of the screen width. */
  :root {
    --ink: #f5f3ee;
    --muted: #a9b1bf;
    --field: #0d1420;        /* replaced by the featured team's darkened color */
    --rule: rgba(245, 243, 238, 0.14);
    --font: 'Barlow Condensed', 'Roboto Condensed', 'sans-serif-condensed', 'Arial Narrow', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--field);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 600;
    overflow: hidden;
    transition: background 1.2s ease;
  }
  /* The portrait screen. On a TV that outputs landscape but hangs sideways, it is turned to fit. */
  #app {
    position: absolute; top: 0; left: 0;
    width: 100vmin; height: 100vmax;
    display: flex; flex-direction: column;
  }
  #app > * { flex-shrink: 0; }
  body.turn-right #app { left: 100vw; transform-origin: top left; transform: rotate(90deg); }
  body.turn-left #app { top: 100vh; transform-origin: top left; transform: rotate(-90deg); }

  .status {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 4vmin 5vmin 3vmin;
    font-size: 6.5vmin; line-height: 1;
  }
  .status .when { font-weight: 800; }
  .status .live::before {
    content: ''; display: inline-block; width: 2.6vmin; height: 2.6vmin; border-radius: 50%;
    background: #ff4d4d; margin-right: 2vmin; vertical-align: 0.6vmin;
  }
  .status .tv { color: var(--muted); font-size: 5vmin; }

  .team {
    position: relative;
    display: grid;
    grid-template-columns: 16vmin 1fr auto;
    align-items: center;
    gap: 4vmin;
    padding: 3vmin 6vmin 3vmin 5vmin;
    min-height: 25vmin;
    background: var(--band);
    color: var(--band-ink);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }
  .team.home { clip-path: polygon(0 0, 100% 3vmin, 100% 100%, 0 100%); margin-top: -1vmin; }
  .team.away { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 calc(100% - 3vmin)); }
  .team.lost { filter: saturate(0.35) brightness(0.7); }
  .team img { width: 16vmin; height: 16vmin; object-fit: contain; filter: drop-shadow(0 0.6vmin 0.8vmin rgba(0,0,0,.35)); }
  .team .who { display: flex; flex-direction: column; min-width: 0; }
  .team .city { font-size: 4.6vmin; font-weight: 500; opacity: .85; line-height: 1; }
  .team .name { font-size: 9vmin; font-weight: 800; line-height: .95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team .record { font-size: 4.4vmin; font-weight: 500; opacity: .8; margin-top: 1vmin; }
  .team .score {
    font-size: 20vmin; font-weight: 800; line-height: .8;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .team .ball {
    position: absolute; left: 0; top: 12%; bottom: 12%; width: 1.6vmin;
    background: var(--band-ink); opacity: 0; transition: opacity .4s;
  }
  .team.has-ball .ball { opacity: 1; }
  .score.scored { animation: scored 1.6s ease-out 1; }
  @keyframes scored { 0% { transform: scale(1); } 25% { transform: scale(1.18); } 100% { transform: scale(1); } }

  .situation {
    margin: 3.5vmin 5vmin 0; padding: 2vmin 3.5vmin;
    font-size: 6.2vmin; font-weight: 800; line-height: 1.05;
    border-left: 1.6vmin solid var(--accent);
    background: rgba(255,255,255,.05);
  }
  .situation.red-zone { border-left-color: #ff4d4d; }
  .situation small { display: block; font-size: 4.6vmin; font-weight: 500; color: var(--muted); margin-top: 1.2vmin; }

  /* Last play: one line; long ones hold, slide to the end, hold, then start over. */
  .play {
    margin: 2.4vmin 5vmin 0; font-size: 4.4vmin; font-weight: 500; line-height: 1.25;
    color: var(--muted); white-space: nowrap; overflow: hidden;
  }
  .play span { display: inline-block; will-change: transform; }
  .play:empty { display: none; }

  /* Other games in your leagues, scrolling along the bottom. */
  .ticker {
    margin-top: 3vmin; padding: 2.6vmin 0; overflow: hidden; white-space: nowrap;
    background: rgba(0,0,0,.28); border-top: 0.5vmin solid var(--accent);
    font-size: 4.6vmin; font-weight: 600;
  }
  .ticker:empty { display: none; }
  .ticker .track { display: inline-flex; will-change: transform; }
  .ticker .tk { display: inline-flex; align-items: baseline; gap: 1.6vmin; padding-right: 8vmin; }
  .ticker .tk b { font-weight: 800; }
  .ticker .tk .n { font-variant-numeric: tabular-nums; }
  .ticker .tk .up { opacity: .55; }
  .ticker .tk em { font-style: normal; font-weight: 500; color: var(--muted); font-size: 3.8vmin; }
  .ticker .tk em.live { color: #ff8a8a; }

  .stats { margin: 3vmin 5vmin 0; display: flex; flex-direction: column; gap: 1.6vmin; }
  .stat { display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline; row-gap: 0.9vmin; }
  .stat .v { font-size: 5vmin; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .v.home { text-align: right; }
  .stat .label { font-size: 3.8vmin; font-weight: 500; color: var(--muted); text-align: center; padding: 0 2vmin; }
  /* Two bars that grow out from the middle, like a tug of war. */
  .stat .bar { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 0.8vmin; height: 1.2vmin; }
  .stat .bar span { background: rgba(255,255,255,.08); display: flex; }
  .stat .bar span:first-child { justify-content: flex-end; }
  .stat .bar i { display: block; height: 100%; }

  .countdown { margin: 8vmin 5vmin 0; }
  .countdown .big { font-size: 17vmin; font-weight: 800; line-height: .9; font-variant-numeric: tabular-nums; }
  .countdown .sub { font-size: 5.4vmin; color: var(--muted); margin-top: 2vmin; font-weight: 500; }

  .spacer { flex: 1; }
  .foot { padding: 3vmin 5vmin; font-size: 3.2vmin; color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; }
  .foot .bad { color: #ff8a8a; }

  .empty { margin: auto 6vmin; font-size: 7vmin; font-weight: 600; line-height: 1.15; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    body { transition: none; }
    .score.scored { animation: none; }
  }
  #rest { display: flex; flex-direction: column; flex: 1; min-height: 0; }


  /* ---- Team screen (?side=away or ?side=home): one team per TV, like the two benches ---- */
  #side { display: none; }
  body.side #top, body.side #rest { display: none; }
  body.side #side { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  #side > * { flex-shrink: 0; }
  #side > .sd-mid { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  body.side { background: var(--sd-dark); }
  .sd-hero {
    position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 3vmin 5vmin 7vmin; background: var(--sd-band); color: var(--sd-ink);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 5vmin), 0 100%);
    transition: filter .8s;
  }
  .sd-hero.lost { filter: saturate(.3) brightness(.65); }
  .sd-tag { font-size: 4vmin; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
  .sd-logo { width: 40vmin; height: 40vmin; object-fit: contain; margin: 2vmin 0 2vmin;
    filter: drop-shadow(0 2.5vmin 3vmin rgba(0,0,0,.35)); animation: float 6s ease-in-out infinite alternate; }
  .sd-city { font-size: 5vmin; font-weight: 500; opacity: .85; line-height: 1; }
  .sd-name { font-size: 12vmin; font-weight: 800; line-height: .9; text-transform: uppercase; }
  .sd-record { font-size: 4.4vmin; font-weight: 500; opacity: .8; margin-top: 1vmin; }
  .sd-score-row { display: flex; align-items: center; justify-content: center; gap: 4vmin; margin-top: 1vmin; }
  .sd-score { font-size: 30vmin; font-weight: 800; line-height: .82; font-variant-numeric: tabular-nums; color: #f5f3ee; }
  .sd-score.scored { animation: scored 1.6s ease-out 1; }
  .sd-ball { width: 5vmin; height: 5vmin; border-radius: 50%; background: var(--sd-band); box-shadow: 0 0 0 1vmin rgba(255,255,255,.85); opacity: 0; transition: opacity .4s; }
  .sd-ball.on { opacity: 1; }
  .sd-flag { text-align: center; font-size: 7vmin; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #f5f3ee; margin-top: 1vmin; }
  .sd-flag:empty { display: none; }
  .sd-flag.win { color: var(--sd-band-bright); }
  .sd-sit { margin: 2vmin 5vmin 0; padding: 2vmin 3.5vmin; font-size: 6.2vmin; font-weight: 800; color: #f5f3ee;
    border-left: 1.6vmin solid var(--sd-band-bright); background: rgba(255,255,255,.06); }
  .sd-sit.red-zone { border-left-color: #ff4d4d; }
  .sd-sit:empty { display: none; }
  .sd-stats { margin: 3vmin 6vmin 0; display: flex; flex-direction: column; gap: 2vmin; color: #f5f3ee; }
  .sd-stat { display: grid; grid-template-columns: 1fr auto; align-items: baseline; row-gap: 1vmin; }
  .sd-stat .l { font-size: 4.4vmin; font-weight: 500; color: var(--muted); }
  .sd-stat .v { font-size: 5.8vmin; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sd-stat .bar { grid-column: 1 / -1; height: 1.3vmin; background: rgba(255,255,255,.08); }
  .sd-stat .bar i { display: block; height: 100%; background: var(--sd-band-bright); transition: width .8s; }
  .sd-countdown { text-align: center; margin-top: 6vmin; color: #f5f3ee; }
  .sd-countdown .big { font-size: 17vmin; font-weight: 800; line-height: .9; font-variant-numeric: tabular-nums; }
  .sd-countdown .sub { font-size: 5.4vmin; color: var(--muted); margin-top: 2vmin; font-weight: 500; }

  /* ---- Leaderboard (golf, racing): the field instead of two teams ---- */
  #field { display: none; }
  body.field #top, body.field #rest, body.field #side, body.field #logo-page { display: none !important; }
  body.field #field { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  body.field { background: #0c1a14; }
  body.field.racing { background: #121418; }
  .fd-head { padding: 4vmin 5vmin 3vmin; border-bottom: .6vmin solid var(--fd-accent, #3fbf7f); }
  .fd-name { font-size: 9vmin; font-weight: 800; line-height: .95; }
  .fd-sub { display: flex; justify-content: space-between; gap: 3vmin; margin-top: 1.6vmin; font-size: 5vmin; color: var(--muted); }
  .fd-sub .live { color: #ff8a8a; font-weight: 700; }
  .fd-rows { display: flex; flex-direction: column; padding: 1.5vmin 0; }
  .fd-row { display: grid; grid-template-columns: 9vmin 7vmin 1fr auto auto; align-items: center; gap: 2.4vmin; padding: 1.5vmin 5vmin; font-size: 5.8vmin; font-weight: 700; line-height: 1.15; }
  .fd-row:nth-child(odd) { background: rgba(255,255,255,.035); }
  .fd-row .p { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .fd-row img { width: 7vmin; height: 7vmin; object-fit: cover; border-radius: 1vmin; }
  .fd-row .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fd-row .s { font-variant-numeric: tabular-nums; text-align: right; }
  .fd-row .t { font-size: 3.8vmin; font-weight: 500; color: var(--muted); text-align: right; white-space: nowrap; }
  .fd-row.lead .p { color: var(--fd-accent, #3fbf7f); }
  .fd-row.lead { font-size: 6.4vmin; }
  body.wide .fd-row { font-size: 5vmin; padding: 1.1vmin 5vmin; }
  body.wide .fd-head { padding: 3vmin 5vmin 2vmin; }
  body.wide .fd-name { font-size: 7vmin; }

  /* ---- Pregame: recent form and players to watch ---- */
  .pg { margin: 2.4vmin 5vmin 0; display: flex; flex-direction: column; gap: 2vmin; color: #f5f3ee; }
  .pg h4 { margin: 0; font-size: 4vmin; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .pg-form { display: grid; grid-template-columns: 14vmin 1fr auto; align-items: center; gap: 2.5vmin; }
  .pg-form .who { font-size: 5.4vmin; font-weight: 800; }
  .pg-chips { display: flex; gap: 1.4vmin; }
  .pg-chip { width: 10vmin; padding: .9vmin 0 .7vmin; border-radius: 1.2vmin; text-align: center; background: rgba(255,255,255,.08); line-height: 1; }
  .pg-chip b { display: block; font-size: 5vmin; }
  .pg-chip small { display: block; font-size: 2.9vmin; font-weight: 500; color: var(--muted); margin-top: .6vmin; }
  .pg-chip.W b { color: #5ad19a; } .pg-chip.L b { color: #ff7b7b; }
  .pg-avg { font-size: 3vmin; color: var(--muted); text-align: right; line-height: 1.15; white-space: nowrap; }
  .pg-avg b { color: #f5f3ee; font-size: 4.4vmin; }
  .pg-player { display: grid; grid-template-columns: 12vmin 1fr auto; align-items: center; gap: 3vmin; }
  .pg-player img, .pg-player .ph { width: 12vmin; height: 12vmin; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,.08); }
  .pg-player .nm { font-size: 5.2vmin; font-weight: 800; line-height: 1.05; }
  .pg-player .nm small { display: block; font-size: 3.6vmin; font-weight: 500; color: var(--muted); }
  .pg-player .val { font-size: 4.2vmin; font-weight: 700; text-align: right; max-width: 34vmin; line-height: 1.15; }
  .countdown.slim { margin-top: 2.5vmin; } .countdown.slim .big { font-size: 11vmin; } .countdown.slim .sub { margin-top: .6vmin; font-size: 4.6vmin; }
  .sd-countdown.slim { margin-top: 2vmin; } .sd-countdown.slim .big { font-size: 12vmin; } .sd-countdown.slim .sub { margin-top: 1vmin; }

  /* ---- Field view (?view=field): live drive on a football field, for a wide screen ---- */
  #gridiron { display: none; }
  body.gridiron #app { width: 100vw; height: 100vh; }
  body.gridiron #top, body.gridiron #rest, body.gridiron #side, body.gridiron #play, body.gridiron #ticker, body.gridiron #logo-page { display: none !important; }
  body.gridiron #gridiron { display: flex; flex-direction: column; position: absolute; inset: 0; background: #0a0f0c; }
  .gi-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 2.4vmin 4vmin; gap: 3vmin; background: rgba(0,0,0,.35); }
  .gi-team { display: flex; align-items: center; gap: 2.4vmin; font-weight: 800; font-size: 6vmin; }
  .gi-team.home { justify-content: flex-end; }
  .gi-team img { width: 9vmin; height: 9vmin; object-fit: contain; }
  .gi-team .sc { font-size: 9vmin; font-variant-numeric: tabular-nums; min-width: 1.3em; text-align: center; }
  .gi-team .poss { width: 2.4vmin; height: 2.4vmin; border-radius: 50%; background: #f5f3ee; visibility: hidden; }
  .gi-team.ball .poss { visibility: visible; }
  .gi-mid { text-align: center; line-height: 1.05; }
  .gi-mid .clock { font-size: 5.4vmin; font-weight: 800; }
  .gi-mid .dd { font-size: 4.4vmin; font-weight: 700; color: #ffd166; margin-top: .8vmin; }
  .gi-field { position: relative; flex: 1; margin: 2vmin 3vmin 0; min-height: 0; }
  .gi-field svg { width: 100%; height: 100%; display: block; }
  .gi-label { position: absolute; left: 4vmin; top: 3vmin; font-size: 3.6vmin; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; padding: .8vmin 2vmin; border-radius: 1vmin; background: rgba(0,0,0,.55); }
  .gi-label.score { background: #ffd166; color: #111; }
  .gi-play { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 3vmin; padding: 2.4vmin 4vmin 3vmin; min-height: 18vmin; }
  .gi-faces { display: flex; gap: 1.6vmin; }
  .gi-face { text-align: center; width: 15vmin; }
  .gi-face img, .gi-face .ph { width: 13vmin; height: 13vmin; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,.08); display: block; margin: 0 auto; }
  .gi-face span { display: block; font-size: 2.8vmin; font-weight: 600; color: var(--muted); margin-top: .6vmin; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gi-text { font-size: 4.2vmin; font-weight: 600; line-height: 1.25; color: #f5f3ee; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .gi-text small { display: block; font-size: 3.4vmin; color: var(--muted); font-weight: 500; margin-bottom: .6vmin; }

  /* Team screen panel: stats and drive chart, cross-fading. */
  .sd-panes { position: relative; height: 100%; }
  .sd-pane { position: absolute; inset: 0; transition: opacity .8s ease; }
  .sd-pane.drive { opacity: 0; }
  .sd-panes.show-drive .sd-pane.drive { opacity: 1; }
  .sd-panes.show-drive .sd-pane.stats { opacity: 0; }
  /* While the drive chart shows, the big logo tucks away to give the field room. */
  body.side.drive-on .sd-logo, body.side.drive-on .sd-city, body.side.drive-on .sd-record, body.side.drive-on .sd-tag,
  body.side.drive-on .sd-sit, body.side.drive-on #play { display: none; }
  body.side.drive-on .sd-hero { padding-bottom: 6vmin; }
  .sd-drive-head { margin: 3vmin 5vmin 0; font-size: 5.6vmin; font-weight: 800; color: #f5f3ee; letter-spacing: .04em; text-transform: uppercase; }
  .sd-drive-head small { display: block; font-size: 4vmin; font-weight: 500; color: var(--muted); text-transform: none; letter-spacing: 0; margin-top: .6vmin; }
  .sd-drive-head.score { color: #ffd166; }
  .sd-field { margin: 2.4vmin 5vmin 0; aspect-ratio: 3 / 2; border-radius: 1.2vmin; overflow: hidden; }
  .sd-field svg { width: 100%; height: 100%; display: block; }
  .sd-drive-play { margin: 2.4vmin 5vmin 0; font-size: 4.2vmin; font-weight: 600; line-height: 1.25; color: #f5f3ee;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  /* ---- Logo page (?view=logo): the projector. Landscape, never turned. ---- */
  body.wide #app { width: 100vw; height: 100vh; }
  #logo-page { display: none; }
  body.wide #top, body.wide #play, body.wide #rest, body.wide #ticker { display: none; }
  body.wide #logo-page {
    display: flex; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 42%, var(--lp1) 0%, var(--lp2) 62%, #05070b 100%);
    transition: background 1.5s ease; overflow: hidden;
  }
  .lp-sweep {
    position: absolute; inset: -20% -60%;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.10) 50%, transparent 58%);
    animation: sweep 9s ease-in-out infinite;
  }
  @keyframes sweep { 0%, 35% { transform: translateX(-60%); } 75%, 100% { transform: translateX(60%); } }
  .lp-logo {
    position: relative; width: 62vmin; height: 62vmin; object-fit: contain;
    filter: drop-shadow(0 3vmin 5vmin rgba(0,0,0,.45));
    animation: float 6s ease-in-out infinite alternate;
  }
  /* The logo floats: drifts up and down with a slight tilt, its shadow on the floor growing and shrinking. */
  @keyframes float {
    from { transform: translateY(2.2vmin) rotate(-1.2deg); }
    to   { transform: translateY(-2.2vmin) rotate(1.2deg); }
  }
  .lp-shadow {
    position: relative; width: 34vmin; height: 3.4vmin; margin-top: 1.5vmin; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,.45), transparent 70%);
    animation: shadow 6s ease-in-out infinite alternate;
  }
  @keyframes shadow { from { transform: scaleX(1); opacity: .9; } to { transform: scaleX(.75); opacity: .5; } }
  .bug {
    position: absolute; right: 4vmin; bottom: 4vmin; padding: 1.6vmin 3vmin;
    display: flex; gap: 2.6vmin; align-items: baseline;
    background: rgba(0,0,0,.45); border-radius: 1.2vmin; font-size: 4.6vmin; font-weight: 800;
    font-variant-numeric: tabular-nums; color: #f5f3ee;
  }
  .bug:empty { display: none; }
  .bug em { font-style: normal; font-weight: 500; color: var(--muted); font-size: 3.8vmin; }
  .bug em.live { color: #ff8a8a; }
  .bug .dim { opacity: .55; }
  /* Takeovers on a wide screen: picture on the left, words on the right. */
  body.wide .tko .content { display: grid; grid-template-columns: auto auto; align-items: center; justify-content: center; column-gap: 7vmin; }
  body.wide .tko .content > .logo, body.wide .tko .content > video { grid-column: 1; grid-row: 1 / span 3; margin: 0; }
  body.wide .tko .content > .logo { width: 62vmin; height: 62vmin; }
  body.wide .tko .content > video { width: 48vw; max-height: 80vh; }
  body.wide .tko .word, body.wide .tko .line, body.wide .tko .small { grid-column: 2; justify-self: center; }
  body.wide .tko .line { margin-top: 5vmin; }
  body.wide .banner { top: auto; bottom: 8vmin; }
  body.wide .tko.anthem .content { display: flex; }
  body.wide .flag { width: 120vmin; height: calc(120vmin * 10 / 19); }
  body.wide .flag i { background-size: 120vmin 100%; }

  /* ---- Takeovers: the whole screen for a score, a win or the anthem ---- */
  .tko {
    position: absolute; inset: 0; z-index: 10; overflow: hidden;
    background: var(--t1); color: var(--t-ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .tko[hidden], .banner[hidden] { display: none; }
  .tko.out { animation: tko-out .6s ease-in forwards; }
  @keyframes tko-out { to { opacity: 0; } }
  .tko .stripes {
    position: absolute; inset: -60%;
    background: repeating-linear-gradient(-30deg, var(--t1) 0 9vmin, var(--t2) 9vmin 18vmin);
    opacity: .32; animation: stripes 1.1s linear infinite;
  }
  @keyframes stripes { to { transform: translateY(20.785vmin); } }
  .tko .flash { position: absolute; inset: 0; background: #fff; animation: flash .8s ease-out both; pointer-events: none; }
  @keyframes flash { from { opacity: .95; } to { opacity: 0; } }
  .tko .content { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; }
  .tko .word {
    font-weight: 800; line-height: .8; text-transform: uppercase; letter-spacing: -.01em;
    text-shadow: 0 1.4vmin 0 rgba(0,0,0,.22);
  }
  .tko .word span { display: block; width: max-content; margin: 0 auto; animation: slam .55s cubic-bezier(.2,1.5,.4,1) both; }
  .tko .word span + span { animation-delay: .18s; }
  @keyframes slam { from { transform: scale(2.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .tko .logo { width: 44vmin; height: 44vmin; object-fit: contain; margin: 0 0 7vmin; animation: pop .7s .3s cubic-bezier(.2,1.4,.4,1) both, float 3s 1s ease-in-out infinite alternate; filter: drop-shadow(0 1.5vmin 2vmin rgba(0,0,0,.35)); }
  @keyframes pop { from { transform: scale(.2) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .tko video { width: 100%; max-height: 62vmax; margin: 6vmin 0; background: #000; object-fit: contain; animation: rise .5s .2s both; }
  .tko .line { margin-top: 8vmin; font-size: 10vmin; font-weight: 800; display: flex; gap: 6vmin; font-variant-numeric: tabular-nums; animation: rise .5s .6s both; }
  .tko .line .dim { opacity: .55; }
  .tko .small { font-size: 6vmin; font-weight: 600; opacity: .85; margin-top: 3vmin; letter-spacing: .08em; text-transform: uppercase; animation: rise .5s .8s both; }
  @keyframes rise { from { transform: translateY(6vmin); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Goal: the red goal light spinning over the team color. */
  .tko .beacon {
    position: absolute; left: 50%; top: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax;
    background: conic-gradient(rgba(230,0,0,0) 0deg, rgba(235,10,10,1) 35deg, rgba(230,0,0,0) 75deg,
                               rgba(230,0,0,0) 180deg, rgba(235,10,10,1) 215deg, rgba(230,0,0,0) 255deg);
    animation: spin 1.1s linear infinite; opacity: .6;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Win: confetti in team colors. */
  .tko .confetti i {
    position: absolute; top: -6vmax; width: 2.4vmin; height: 4.2vmin; background: var(--c);
    left: var(--x); animation: fall var(--d) var(--w) linear infinite; opacity: .95;
  }
  @keyframes fall { to { transform: translateY(115vmax) rotate(var(--r)); } }

  /* Anthem: a waving flag on a dark screen. */
  .tko.anthem { background: #04060b; color: #e9ecf2; animation: fade-in 2s ease both; }
  @keyframes fade-in { from { opacity: 0; } }
  .flag { display: flex; width: 88vmin; height: calc(88vmin * 10 / 19); filter: drop-shadow(0 2vmin 3vmin rgba(0,0,0,.6)); }
  .flag i { flex: 1; background-size: 88vmin 100%; animation: wave 2.6s ease-in-out infinite alternate; }
  @keyframes wave {
    from { transform: translateY(-1.4vmin); filter: brightness(1.08); }
    to   { transform: translateY(1.4vmin);  filter: brightness(.82); }
  }
  .tko.anthem .small { margin-top: 9vmin; font-size: 6.4vmin; opacity: .7; }
  .tko.anthem .full { position: absolute; inset: 0; width: 100%; height: 100%; max-height: none; margin: 0; object-fit: contain; background: #04060b; animation: none; }

  /* Banners: 3rd down and 2-point tries, over the scoreboard, not instead of it. */
  .banner {
    position: absolute; left: 0; right: 0; top: 40%; z-index: 9; overflow: hidden;
    padding: 5vmin 5vmin 4.5vmin; text-align: center;
    background: var(--t1); color: var(--t-ink);
    box-shadow: 0 2vmin 6vmin rgba(0,0,0,.5);
    animation: band-in .45s cubic-bezier(.2,1.3,.4,1) both;
  }
  .banner.out { animation: band-out .4s ease-in forwards; }
  @keyframes band-in { from { transform: scaleY(0); } }
  @keyframes band-out { to { transform: scaleY(0); opacity: 0; } }
  .banner .stripes { position: absolute; inset: -60%; background: repeating-linear-gradient(-30deg, var(--t1) 0 7vmin, var(--t2) 7vmin 14vmin); opacity: .25; animation: stripes 1.1s linear infinite; }
  .banner b { position: relative; display: block; font-size: 19vmin; font-weight: 800; line-height: .85; }
  .banner.defense b { animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.07); } }
  .banner span { position: relative; display: block; font-size: 6.4vmin; font-weight: 600; margin-top: 2vmin; opacity: .9; }

  @media (prefers-reduced-motion: reduce) {
    .tko *, .banner, .banner * { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="top"><div class="empty">Connecting to Game Day…</div></div>
  <div id="gridiron"><div class="gi-bar"></div><div class="gi-field"></div><div class="gi-play"></div></div>
  <div id="field"><div class="fd-head"><div class="fd-name"></div><div class="fd-sub"></div></div><div class="fd-rows"></div></div>
  <div id="side">
    <div class="status sd-status"></div>
    <div class="sd-hero"><div class="sd-tag"></div><img class="sd-logo" alt="" hidden onerror="this.hidden=true"><div class="sd-city"></div><div class="sd-name"></div><div class="sd-record"></div></div>
    <div class="sd-score-row"><span class="sd-ball"></span><span class="sd-score"></span><span class="sd-ball" style="visibility:hidden"></span></div>
    <div class="sd-flag"></div>
    <div class="sd-sit"></div>
    <div class="sd-mid"></div>
  </div>
  <p id="play" class="play"></p>
  <div id="rest"></div>
  <div id="ticker" class="ticker"></div>
  <div id="logo-page"><div class="lp-sweep"></div><img class="lp-logo" alt="" hidden><div class="lp-shadow"></div><div class="bug"></div></div>
  <div id="banner" class="banner" hidden></div>
  <div id="takeover" class="tko" hidden></div>
</div>

<script>
  // Which game: ?team=KC, otherwise the live one, else the next one, else the latest final.
  const params = new URLSearchParams(location.search);
  const wanted = (params.get('team') || '').toUpperCase();
  const app = document.getElementById('app');

  // ?turn=right or ?turn=left for a sideways-hung TV; ?turn=none to never turn.
  // With no setting, a landscape window is turned right automatically.
  // ?view=logo: the projector page, a big team logo in team colors, landscape.
  const fieldView = (params.get('view') || '').toLowerCase() === 'field';
  const logoView = (params.get('view') || '').toLowerCase() === 'logo' || fieldView; // field view falls back to the logo page
  // ?side=away (left TV) or ?side=home (right TV): one team per screen.
  const sideView = ['home', 'away'].includes((params.get('side') || '').toLowerCase()) ? params.get('side').toLowerCase() : null;
  document.body.classList.toggle('side', !!sideView);
  document.body.classList.toggle('wide', logoView);
  function applyTurn() {
    const turn = (params.get('turn') || (logoView ? 'none' : '')).toLowerCase(); // logoView includes the field view
    const landscape = window.innerWidth > window.innerHeight;
    document.body.classList.toggle('turn-right', turn === 'right' || (!turn && landscape));
    document.body.classList.toggle('turn-left', turn === 'left');
  }
  applyTurn();
  window.addEventListener('resize', applyTurn);
  let state = null;
  let lastScores = {};
  let online = false;

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function pickGame(games) {
    const list = Object.entries(games);
    if (wanted) return list.find(([abbr]) => abbr === wanted) || null;
    // The game picker on the dashboard, when set, beats the automatic choice.
    if (state && state.featured) { const f = list.find(([abbr]) => abbr === state.featured); if (f) return f; }
    const by = (s) => list.filter(([, g]) => g.state === s);
    const live = by('in');
    if (live.length) return live[0];
    const pre = by('pre').sort((a, b) => Date.parse(a[1].start) - Date.parse(b[1].start));
    if (pre.length) return pre[0];
    const post = by('post').sort((a, b) => Date.parse(b[1].start) - Date.parse(a[1].start));
    return post[0] || null;
  }

  function luminance(hex) {
    const n = parseInt(hex.slice(1), 16);
    const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
      v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  // Readable text on any team color.
  function inkFor(hex) {
    if (!hex) return '#f5f3ee';
    return luminance(hex) > 0.3 ? '#111418' : '#f5f3ee';
  }

  function darken(hex, amount) {
    if (!hex) return '#0d1420';
    const n = parseInt(hex.slice(1), 16);
    const ch = (v) => Math.round(v * amount).toString(16).padStart(2, '0');
    return `#${ch((n >> 16) & 255)}${ch((n >> 8) & 255)}${ch(n & 255)}`;
  }

  // Show times in the house's time zone, whatever the TV is set to.
  const tz = () => (state && state.timeZone) || undefined;

  function startWord(g) {
    if (g.league === 'nhl' || /hockey/.test(g.league)) return 'puck drop';
    if (/football|nfl/.test(g.league) || /\./.test(g.league)) return 'kickoff';
    if (g.league === 'mlb') return 'first pitch';
    return 'tip-off';
  }

  function periodName(g) {
    const n = g.period;
    if (g.league === 'nhl' || /hockey/.test(g.league)) return n > 3 ? (n === 4 ? 'OT' : `${n - 3}OT`) : ['1st', '2nd', '3rd'][n - 1] || '';
    return n > 4 ? 'OT' : ['1st', '2nd', '3rd', '4th'][n - 1] || '';
  }

  // Near-black team colors vanish on the dark field; use the team's second color instead.
  function bandColor(t) {
    if (!t) return '#2a3342';
    return (t.color && luminance(t.color) > 0.02) ? t.color : (t.altColor || t.color || '#2a3342');
  }

  // Away on the left, home on the right; each bar grows out from the middle in team color.
  function statBars(g) {
    const rows = g.stats || [];
    if (!rows.length) return '';
    const ac = bandColor(g.away), hc = bandColor(g.home);
    return '<div class="stats">' + rows.map((r) => {
      const max = Math.max(r.awayAmount, r.homeAmount) || 1;
      const aw = Math.round((r.awayAmount / max) * 100), hw = Math.round((r.homeAmount / max) * 100);
      return `<div class="stat"><span class="v">${esc(r.away)}</span><span class="label">${esc(r.label)}</span><span class="v home">${esc(r.home)}</span>` +
        `<div class="bar"><span><i style="width:${aw}%;background:${ac}"></i></span><span><i style="width:${hw}%;background:${hc}"></i></span></div></div>`;
    }).join('') + '</div>';
  }

  function teamBand(t, side, g) {
    if (!t) return '';
    const band = bandColor(t);
    const lost = g.state === 'post' && !t.winner && [g.home, g.away].some((x) => x && x.winner);
    const hasBall = g.state === 'in' && g.possession && g.possession === t.id;
    const city = t.fullName && t.name && t.fullName.endsWith(t.name) ? t.fullName.slice(0, -t.name.length).trim() : '';
    const scored = lastScores[`${g.id}:${t.id}`] !== undefined && lastScores[`${g.id}:${t.id}`] < t.score;
    lastScores[`${g.id}:${t.id}`] = t.score;
    return `
      <section class="team ${side}${lost ? ' lost' : ''}${hasBall ? ' has-ball' : ''}" style="--band:${band};--band-ink:${inkFor(band)}">
        <span class="ball"></span>
        ${logoFor(t) ? `<img src="${esc(logoFor(t))}" alt="" onerror="this.style.visibility='hidden'">` : '<span></span>'}
        <div class="who">
          ${city ? `<span class="city">${esc(city)}</span>` : ''}
          <span class="name">${esc(t.name)}</span>
          ${t.record ? `<span class="record">${esc(t.record)}</span>` : ''}
        </div>
        <div class="score${scored ? ' scored' : ''}">${g.state === 'pre' ? '' : t.score}</div>
      </section>`;
  }

  // The team whose colors lead: your team, or in a calendar game the side you cheer for (home if both or neither).
  function featuredTeam(follow, g) {
    const c = g.watch && g.watch.cheer;
    if (c === 'away') return g.away || g.home;
    if (g.watch) return g.home || g.away;
    return [g.home, g.away].find((t) => t && t.abbr === follow) || g.home;
  }

  function statusBar(g) {
    let when;
    if (g.state === 'in' && !['nfl', 'nhl', 'college-football', 'mens-college-hockey'].includes(g.league)) {
      when = `<span class="when live">${esc(g.detail)}</span>`; // innings, halves, quarters: ESPN's own words
    } else if (g.state === 'in') {
      const p = periodName(g);
      const clock = g.clock && g.clock !== '0:00' ? g.clock : '';
      when = /half/i.test(g.detail) || /end of/i.test(g.detail) || /intermission/i.test(g.detail)
        ? `<span class="when live">${esc(g.detail)}</span>`
        : `<span class="when live">${esc(p)} ${esc(clock)}</span>`;
    } else if (g.state === 'post') {
      when = `<span class="when">${esc(g.detail || 'Final')}</span>`;
    } else {
      const d = new Date(g.start);
      when = `<span class="when">${d.toLocaleDateString(undefined, { weekday: 'short', timeZone: tz() })} ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZone: tz() })}</span>`;
    }
    return `<header class="status">${when}<span class="tv">${esc(g.broadcast || '')}</span></header>`;
  }

  // ---- Pregame panels ----
  function countdownText(g) {
    const ms = Date.parse(g.start) - Date.now();
    if (!(ms > 0 && ms < 7 * 24 * 3600 * 1000)) return null;
    const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, sec = Math.floor(ms / 1000) % 60, days = Math.floor(h / 24);
    return days >= 1 ? `${days}d ${h % 24}h` : `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }

  // Last five: a W/L chip per game (with the score under it) and points for/against per game.
  function formRow(t, list) {
    if (!t || !list || !list.length) return '';
    const done = list.filter((x) => x.us != null && x.them != null);
    const avg = (k) => (done.length ? (done.reduce((a, x) => a + x[k], 0) / done.length).toFixed(1).replace(/\.0$/, '') : '');
    return `<div class="pg-form"><span class="who">${esc(t.abbr)}</span><span class="pg-chips">` +
      list.map((x) => `<span class="pg-chip ${esc(x.result)}"><b>${esc(x.result || '·')}</b><small>${x.us != null ? `${x.us}-${x.them}` : esc(x.opp)}</small></span>`).join('') +
      `</span>${done.length ? `<span class="pg-avg"><b>${avg('us')}-${avg('them')}</b><br>avg score</span>` : '<span></span>'}</div>`;
  }

  function playerRow(p) {
    const pic = p.headshot ? `<img src="${esc(p.headshot)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph'}))">` : '<span class="ph"></span>';
    return `<div class="pg-player">${pic}<span class="nm">${esc(p.short || p.name)}<small>${esc([p.pos, p.label].filter(Boolean).join(' · '))}</small></span><span class="val">${esc(p.value)}</span></div>`;
  }

  // Combined scoreboard: both teams' form, and the top player for each.
  function pregameBoth(g) {
    const form = g.form || {}, lead = g.leaders || {};
    const rows = [formRow(g.away, form[g.away?.abbr]), formRow(g.home, form[g.home?.abbr])].filter(Boolean).join('');
    const players = [g.away, g.home].map((t) => t && (lead[t.abbr] || [])[0] && playerRow({ ...(lead[t.abbr] || [])[0], pos: t.abbr })).filter(Boolean).join('');
    if (!rows && !players) return '';
    return `<div class="pg">${rows ? `<h4>Last 5</h4>${rows}` : ''}${players ? `<h4>Players to watch</h4>${players}` : ''}</div>`;
  }

  // Team screen: this team's form and its three leaders.
  function pregameOne(g, t) {
    const list = (g.form || {})[t.abbr];
    const players = ((g.leaders || {})[t.abbr] || []).map(playerRow).join('');
    const form = formRow(t, list);
    if (!form && !players) return '';
    return `<div class="pg">${form ? `<h4>Last 5</h4>${form}` : ''}${players ? `<h4>Players to watch</h4>${players}` : ''}</div>`;
  }

  // Re-render the pregame panels only when their data changes; between changes just tick the clock,
  // so headshots don't reload every second.
  function setWithCountdown(el, html, g) {
    const cd = countdownText(g);
    if (el._tpl === html) { const b = el.querySelector('.cd-big'); if (b && cd) b.textContent = cd; return; }
    el._tpl = html;
    el.innerHTML = html.replace('{CD}', esc(cd || ''));
  }

  function middle(g) {
    if (g.state === 'pre') {
      const pg = pregameBoth(g);
      const cd = countdownText(g) ? `<div class="countdown${pg ? ' slim' : ''}"><div class="big cd-big">{CD}</div><div class="sub">until ${startWord(g)}</div></div>` : '';
      return cd + pg;
    }
    let html = '';
    html += statBars(g);
    html += '<div class="spacer"></div>';
    return html;
  }

  function situation(g) {
    if (g.state !== 'in' || !g.downDistance) return '';
    return `<div class="situation${g.redZone ? ' red-zone' : ''}">${esc(g.downDistance)}${g.redZone ? '<small>Red zone</small>' : ''}</div>`;
  }

  const topEl = document.getElementById('top');
  const restEl = document.getElementById('rest');
  const playEl = document.getElementById('play');
  const tickerEl = document.getElementById('ticker');
  const vmin = () => Math.min(window.innerWidth, window.innerHeight) / 100;
  let featuredId = null;

  // Last play: only touched when the text changes, so a slide in progress is never cut short.
  let playText = null;
  let playAnim = null;
  function setPlay(text) {
    text = text || '';
    if (text === playText) return;
    playText = text;
    if (playAnim) { playAnim.cancel(); playAnim = null; }
    playEl.innerHTML = text ? `<span>${esc(text)}</span>` : '';
    if (!text) return;
    requestAnimationFrame(() => {
      const span = playEl.firstElementChild;
      if (!span) return;
      const dist = span.scrollWidth - playEl.clientWidth;
      if (dist <= 0) return;
      const slide = (dist / (9 * vmin())) * 1000; // about 9% of the screen width per second
      const hold = 2000, rest = 2500, total = hold + slide + rest;
      playAnim = span.animate([
        { transform: 'translateX(0)', offset: 0 },
        { transform: 'translateX(0)', offset: hold / total },
        { transform: `translateX(${-dist}px)`, offset: (hold + slide) / total },
        { transform: `translateX(${-dist}px)`, offset: 1 },
      ], { duration: total, iterations: Infinity, easing: 'linear' });
    });
  }

  // Ticker: rebuilt only between laps, so scores update without a jump.
  function tickerHTML() {
    const items = ((state && state.ticker) || []).filter((t) => t.id !== featuredId);
    const rank = { in: 0, pre: 1, post: 2 };
    items.sort((a, b) => rank[a.state] - rank[b.state] || Date.parse(a.start) - Date.parse(b.start));
    return items.map((t) => {
      let when;
      if (t.state === 'in') when = `<em class="live">${esc(t.detail)}</em>`;
      else if (t.state === 'post') when = `<em>${esc(t.detail || 'Final')}</em>`;
      else when = `<em>${new Date(t.start).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZone: tz() })}</em>`;
      const n = (side) => (t.state === 'pre' ? '' : `<span class="n">${side.score}</span>`);
      const loser = (me, other) => t.state === 'post' && me.score < other.score ? ' class="up"' : '';
      return `<span class="tk"><b${loser(t.away, t.home)}>${esc(t.away.abbr)}</b>${n(t.away)}${t.state === 'pre' ? '<em>at</em>' : ''}<b${loser(t.home, t.away)}>${esc(t.home.abbr)}</b>${n(t.home)}${when}</span>`;
    }).join('');
  }

  let tickerRunning = false;
  function runTicker() {
    const html = tickerHTML();
    if (!html) { tickerEl.innerHTML = ''; tickerRunning = false; return; }
    tickerRunning = true;
    tickerEl.innerHTML = `<div class="track"><div>${html}</div><div aria-hidden="true">${html}</div></div>`;
    const track = tickerEl.firstElementChild;
    requestAnimationFrame(() => {
      const lap = track.firstElementChild.offsetWidth;
      const ms = (lap / (8 * vmin())) * 1000; // about 8% of the screen width per second
      const anim = track.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${-lap}px)` }], { duration: ms, easing: 'linear' });
      anim.onfinish = runTicker;
    });
  }

  // Logo page: the logo and colors change only when the team does, so the animation never restarts.
  const lpEl = document.getElementById('logo-page');
  const lpLogo = lpEl.querySelector('.lp-logo');
  const lpBug = lpEl.querySelector('.bug');
  let lpTeam = null;
  function renderLogo(t, g) {
    if (t && t.abbr !== lpTeam) {
      lpTeam = t.abbr;
      const c = bandColor(t);
      lpEl.style.setProperty('--lp1', c);
      lpEl.style.setProperty('--lp2', darken(c, 0.45));
      lpLogo.hidden = !logoFor(t);
      if (logoFor(t)) lpLogo.src = logoFor(t);
    }
    lpBug.innerHTML = params.get('bug') === '0' || !g ? '' : bugHTML(g);
  }
  function bugHTML(g) {
    if (!g.away || !g.home) return '';
    if (g.state === 'pre') {
      const d = new Date(g.start);
      return `<span>${esc(g.away.abbr)}</span><em>at</em><span>${esc(g.home.abbr)}</span><em>${d.toLocaleDateString(undefined, { weekday: 'short', timeZone: tz() })} ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZone: tz() })}</em>`;
    }
    const dim = (a, b) => (g.state === 'post' && a.score < b.score ? ' class="dim"' : '');
    const when = g.state === 'in' ? `<em class="live">${esc(g.detail)}</em>` : `<em>${esc(g.detail || 'Final')}</em>`;
    return `<span${dim(g.away, g.home)}>${esc(g.away.abbr)} ${g.away.score}</span><span${dim(g.home, g.away)}>${esc(g.home.abbr)} ${g.home.score}</span>${when}`;
  }

  // Team screen: the hero (logo, name) is rebuilt only when the team changes, so the logo keeps floating.
  const sdEl = document.getElementById('side');
  const sd = (c) => sdEl.querySelector(c);
  let sdKey = null, sdScore = null;
  function renderSide(g) {
    const t = g[sideView], opp = g[sideView === 'home' ? 'away' : 'home'];
    if (!t) return;
    const band = bandColor(t);
    const key = `${g.id}:${t.abbr}:${logoFor(t)}`;
    if (key !== sdKey) {
      sdKey = key; sdScore = null;
      const bright = luminance(band) < 0.06 ? (t.altColor || '#f5f3ee') : band;
      document.body.style.setProperty('--sd-band', band);
      document.body.style.setProperty('--sd-ink', inkFor(band));
      document.body.style.setProperty('--sd-dark', darken(band, 0.22));
      document.body.style.setProperty('--sd-band-bright', bright);
      document.body.style.setProperty('--accent', bright);
      const city = t.fullName && t.name && t.fullName.endsWith(t.name) ? t.fullName.slice(0, -t.name.length).trim() : '';
      sd('.sd-tag').textContent = g.kind === 'match' ? [g.event, g.round].filter(Boolean).join(' · ') || sideView : sideView;
      const logo = logoFor(t);
      sd('.sd-logo').hidden = !logo;
      if (logo) sd('.sd-logo').src = logo;
      // Players and fighters: full name, last name big.
      const full = t.fullName || t.name || t.abbr;
      sd('.sd-city').textContent = g.kind === 'match' ? full.split(' ').slice(0, -1).join(' ') : city;
      sd('.sd-name').textContent = g.kind === 'match' ? full.split(' ').slice(-1)[0] : (t.name || t.abbr);
    }
    sd('.sd-record').textContent = t.record || '';
    sd('.sd-status').innerHTML = statusBar(g).replace(/^<header class="status">|<\/header>$/g, '');
    const won = g.state === 'post' && t.winner;
    const lost = g.state === 'post' && !t.winner && opp && opp.winner;
    sd('.sd-hero').classList.toggle('lost', !!lost);
    const scoreEl = sd('.sd-score');
    if (g.state === 'pre') { scoreEl.textContent = ''; }
    else {
      if (sdScore !== null && t.score > sdScore) { scoreEl.classList.remove('scored'); void scoreEl.offsetWidth; scoreEl.classList.add('scored'); }
      scoreEl.textContent = t.score;
      sdScore = t.score;
    }
    sd('.sd-ball').classList.toggle('on', g.state === 'in' && !!g.possession && g.possession === t.id);
    const flag = sd('.sd-flag');
    flag.className = 'sd-flag' + (won ? ' win' : '');
    flag.textContent = won ? 'Win' : lost ? 'Final' : '';
    const hasBall = g.state === 'in' && g.possession === t.id && g.downDistance;
    const sit = sd('.sd-sit');
    sit.className = 'sd-sit' + (hasBall && g.redZone ? ' red-zone' : '');
    sit.textContent = hasBall ? g.downDistance + (g.redZone ? ' · Red zone' : '') : '';
    let mid = '';
    if (g.state === 'pre') {
      const pg = pregameOne(g, t);
      mid = (countdownText(g) ? `<div class="sd-countdown${pg ? ' slim' : ''}"><div class="big cd-big">{CD}</div><div class="sub">until ${startWord(g)}</div></div>` : '') + pg;
    } else if (g.kind === 'match' && (t.periods || []).length) {
      // Tennis: games won in each set, each bar against the other player's.
      mid = '<div class="sd-stats">' + t.periods.map((v, i) => {
        const o = (opp && opp.periods && opp.periods[i]) || 0;
        const max = Math.max(v, o) || 1;
        return `<div class="sd-stat"><span class="l">Set ${i + 1}</span><span class="v">${v}</span><div class="bar"><i style="width:${Math.round((v / max) * 100)}%"></i></div></div>`;
      }).join('') + '</div>';
    } else if ((g.stats || []).length || (g.drives && (g.drives.current || g.drives.last || g.drives.lastScore))) {
      // This team's numbers; each bar is measured against the other team's.
      const stats = '<div class="sd-stats">' + (g.stats || []).slice(0, 6).map((r) => {
        const mine = sideView === 'home' ? r.homeAmount : r.awayAmount;
        const max = Math.max(r.homeAmount, r.awayAmount) || 1;
        return `<div class="sd-stat"><span class="l">${esc(r.label)}</span><span class="v">${esc(sideView === 'home' ? r.home : r.away)}</span>` +
          `<div class="bar"><i style="width:${Math.round((mine / max) * 100)}%"></i></div></div>`;
      }).join('') + '</div>';
      const drive = sideDrive(g, t);
      mid = drive ? `<div class="sd-panes${panelShowsDrive(g, t) ? ' show-drive' : ''}"><div class="sd-pane stats">${stats}</div><div class="sd-pane drive">${drive}</div></div>` : stats;
    }
    setWithCountdown(sd('.sd-mid'), mid, g);
    document.body.classList.toggle('drive-on', mid.includes('sd-panes show-drive'));
    setPlay(g.state === 'in' ? g.lastPlay : '');
    if (!tickerRunning) runTicker();
  }

  // Leaderboard: left TV (side=away) shows places 1-10, right TV (side=home) 11-20,
  // the combined scoreboard 1-12 and the projector the top 8.
  const fdEl = document.getElementById('field');
  function renderField(g) {
    document.body.classList.toggle('racing', /nascar|irl|f1/.test(g.league));
    fdEl.style.setProperty('--fd-accent', /nascar|irl|f1/.test(g.league) ? '#e5484d' : '#3fbf7f');
    const [from, count] = sideView === 'home' ? [10, 10] : sideView === 'away' ? [0, 10] : logoView ? [0, 8] : [0, 12];
    fdEl.querySelector('.fd-name').textContent = g.shortName || g.name;
    const when = g.state === 'in' ? `<span class="live">${esc(g.detail)}</span>` : g.state === 'post' ? esc(g.detail || 'Final')
      : esc(new Date(g.start).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: tz() }));
    fdEl.querySelector('.fd-sub').innerHTML = `<span>${when}</span><span>${esc(sideView === 'home' ? 'Places 11-20' : g.broadcast || '')}</span>`;
    const rows = (g.leaders || []).slice(from, from + count);
    fdEl.querySelector('.fd-rows').innerHTML = rows.length ? rows.map((l, i) => `
      <div class="fd-row${from + i === 0 ? ' lead' : ''}">
        <span class="p">${esc(l.pos)}</span>
        ${l.pic ? `<img src="${esc(l.pic)}" alt="" onerror="this.style.visibility='hidden'">` : '<span></span>'}
        <span class="n">${esc(l.short || l.name)}</span>
        <span class="t">${esc(l.note)}</span>
        <span class="s">${esc(l.score)}</span>
      </div>`).join('') : `<div class="empty">${g.state === 'pre' ? 'The field shows here once it starts.' : 'No standings yet.'}</div>`;
    setPlay('');
    if (!logoView && !tickerRunning) runTicker();
  }

  // ---- Field view -------------------------------------------------------
  // The offense always drives left to right: their end zone on the left, the one they're attacking on
  // the right. Each play of the drive is a bar from where it started to where it ended, stacked
  // top to bottom; gains in team color, losses in red, the scoring play in gold.
  const giEl = document.getElementById('gridiron');
  let scoreDriveUntil = 0; // after a touchdown or field goal, show the scoring drive for a minute

  function giTeam(t, side, g) {
    if (!t) return '';
    const ball = g.state === 'in' && g.possession === t.id;
    const pic = logoFor(t) ? `<img src="${esc(logoFor(t))}" alt="" onerror="this.style.visibility='hidden'">` : '';
    const inner = side === 'away' ? `${pic}<span>${esc(t.abbr)}</span><span class="sc">${t.score}</span><span class="poss"></span>`
      : `<span class="poss"></span><span class="sc">${t.score}</span><span>${esc(t.abbr)}</span>${pic}`;
    return `<div class="gi-team ${side}${ball ? ' ball' : ''}">${inner}</div>`;
  }

  function fieldSVG(g, drive, offense, defense, scoring, H = 420, big = false) {
    const fs = big ? 46 : 26, ez = big ? 70 : 40, maxRow = big ? 60 : 30; // bigger marks for a TCL
    const W = 1200, X = (yte) => 100 + (100 - yte) * 10; // yards to end zone -> x
    const oc = bandColor(offense || {}), dc = bandColor(defense || {});
    let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`;
    svg += `<rect width="${W}" height="${H}" fill="#1f5b33"/>`;
    for (let i = 0; i < 10; i++) if (i % 2) svg += `<rect x="${100 + i * 100}" width="100" height="${H}" fill="#226338"/>`;
    svg += `<rect width="100" height="${H}" fill="${oc}" opacity=".85"/><rect x="1100" width="100" height="${H}" fill="${dc}" opacity=".85"/>`;
    svg += `<text x="50" y="${H / 2}" fill="${inkFor(oc)}" font-size="${ez}" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 50 ${H / 2})" font-family="Barlow Condensed, sans-serif">${esc(offense?.abbr || '')}</text>`;
    svg += `<text x="1150" y="${H / 2}" fill="${inkFor(dc)}" font-size="${ez}" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(90 1150 ${H / 2})" font-family="Barlow Condensed, sans-serif">${esc(defense?.abbr || '')}</text>`;
    for (let yd = 10; yd < 100; yd += 10) {
      const x = 100 + yd * 10, n = yd <= 50 ? yd : 100 - yd;
      svg += `<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>`;
      svg += `<text x="${x}" y="${H - 14}" fill="#fff" fill-opacity=".55" font-size="${fs}" font-weight="700" text-anchor="middle" font-family="Barlow Condensed, sans-serif">${n}</text>`;
    }
    const plays = ((drive && drive.plays) || []).filter((p) => p.from != null && p.to != null);
    const shown = plays.slice(-12);
    const top = big ? 40 : 78, rowH = Math.min(maxRow, (H - top - (big ? 90 : 60)) / Math.max(shown.length, 6));
    shown.forEach((p, i) => {
      const x1 = X(p.from), x2 = X(p.to), y = top + i * rowH;
      const gain = p.to <= p.from;
      // Gains in the offense's color (white if it's too dark to see), lost yards gray, the score gold.
      const gainColor = luminance(oc) < 0.04 ? '#f5f3ee' : oc;
      const color = p.scoring ? '#ffd166' : gain ? gainColor : '#8b929c';
      const a = Math.min(x1, x2), w = Math.max(Math.abs(x2 - x1), 6);
      svg += `<rect x="${a}" y="${y}" width="${w}" height="${rowH * .62}" rx="${rowH * .3}" fill="${color}" stroke="#000" stroke-opacity=".25"/>`;
      svg += `<circle cx="${x2}" cy="${y + rowH * .31}" r="${rowH * .36}" fill="#fff"/>`;
    });
    // Line of scrimmage and the first-down line, from the live situation.
    if (!scoring && g.state === 'in' && g.yardsToEndzone != null) {
      const los = X(g.yardsToEndzone);
      svg += `<line x1="${los}" x2="${los}" y1="0" y2="${H}" stroke="#4f8cff" stroke-width="${big ? 10 : 6}"/>`;
      if (g.distance && g.distance < g.yardsToEndzone) {
        const fd = X(g.yardsToEndzone - g.distance);
        svg += `<line x1="${fd}" x2="${fd}" y1="0" y2="${H}" stroke="#ffd166" stroke-width="${big ? 10 : 6}"/>`;
      }
      svg += `<ellipse cx="${los}" cy="${H - (big ? 80 : 48)}" rx="${big ? 26 : 16}" ry="${big ? 16 : 10}" fill="#8b4a1c" stroke="#fff" stroke-width="2"/>`;
    }
    return svg + '</svg>';
  }

  function renderGridiron(g) {
    const d = g.drives || {};
    const scoring = Date.now() < scoreDriveUntil && d.lastScore;
    const drive = scoring ? d.lastScore : (d.current || d.last);
    const offAbbr = drive ? drive.team : null;
    const offense = [g.home, g.away].find((t) => t && (t.abbr === offAbbr || (!offAbbr && t.id === g.possession))) || g.away;
    const defense = offense === g.home ? g.away : g.home;
    const clock = g.state === 'post' ? (g.detail || 'Final') : statusBar(g).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    giEl.querySelector('.gi-bar').innerHTML = giTeam(g.away, 'away', g) +
      `<div class="gi-mid"><div class="clock">${esc(clock)}</div><div class="dd">${esc(g.state === 'in' && !scoring ? (g.downDistance || '') : '')}</div></div>` + giTeam(g.home, 'home', g);
    const label = scoring ? `<div class="gi-label score">Scoring drive · ${esc(offense.abbr)} · ${esc(d.lastScore.description || d.lastScore.result)}</div>`
      : drive ? `<div class="gi-label">${esc(offense.abbr)} drive${drive.description ? ' · ' + esc(drive.description) : ''}</div>` : '';
    giEl.querySelector('.gi-field').innerHTML = fieldSVG(g, drive, offense, defense, scoring) + label;
    const plays = (drive && drive.plays) || [];
    const last = plays[plays.length - 1];
    const text = last ? last.text : g.lastPlay || '';
    const faces = ((last && last.players) || []).map((p) => `<div class="gi-face">${p.headshot ? `<img src="${esc(p.headshot)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph'}))">` : '<span class="ph"></span>'}<span>${esc(p.short || p.name)}</span></div>`).join('');
    const sub = last ? [last.downText, last.clock && `${periodName({ ...g, period: last.period || g.period })} ${last.clock}`].filter(Boolean).join(' · ') : '';
    const html = `<div class="gi-faces">${faces}</div><div class="gi-text">${sub ? `<small>${esc(sub)}</small>` : ''}${esc(text)}</div>`;
    const playEl = giEl.querySelector('.gi-play');
    if (playEl._html !== html) { playEl._html = html; playEl.innerHTML = html; }
  }

  // ---- Team screens: stats and the drive chart take turns ----
  // ?panel=cycle (default) swaps every 5 minutes (?cycle=<seconds> to change it), the two TVs out of step so one shows the drive while
  // the other shows stats. ?panel=stats or ?panel=drive holds one. After a touchdown or field goal the
  // scoring team's screen shows the scoring drive for a minute.
  const panelMode = (params.get('panel') || 'cycle').toLowerCase();
  const CYCLE_MS = Math.max(10, Number(params.get('cycle')) || 300) * 1000;
  let scoringTeam = null;

  function panelShowsDrive(g, t) {
    if (Date.now() < scoreDriveUntil && g.drives && g.drives.lastScore) return scoringTeam === t.abbr;
    if (panelMode === 'drive') return true;
    if (panelMode === 'stats') return false;
    const phase = Math.floor(Date.now() / CYCLE_MS) % 2;
    return (phase === 0) === (sideView !== 'home');
  }

  function sideDrive(g, t) {
    if (!/nfl|football|cfl|ufl/.test(g.league) || !g.drives) return '';
    const d = g.drives;
    const scoring = Date.now() < scoreDriveUntil && d.lastScore && scoringTeam === t.abbr;
    const drive = scoring ? d.lastScore : (d.current || d.last);
    if (!drive) return '';
    const offense = [g.home, g.away].find((x) => x && x.abbr === drive.team) || t;
    const defense = offense === g.home ? g.away : g.home;
    const plays = drive.plays || [];
    const last = plays[plays.length - 1];
    const title = scoring ? `Scoring drive · ${offense.abbr}` : `${offense.abbr} drive`;
    return `<div class="sd-drive-head${scoring ? ' score' : ''}">${esc(title)}<small>${esc(drive.description || '')}</small></div>` +
      `<div class="sd-field">${fieldSVG(g, drive, offense, defense, scoring, 800, true)}</div>` +
      (last ? `<div class="sd-drive-play">${esc(last.text)}</div>` : '');
  }

  // Flip the panels on the beat without waiting for new data.
  if (sideView) setInterval(() => {
    const panes = document.querySelector('#side .sd-panes');
    if (!panes || !state) return;
    const pick = pickGame(state.games || {});
    if (!pick) return;
    const g = pick[1], t = g[sideView];
    if (t) { const on = panelShowsDrive(g, t); panes.classList.toggle('show-drive', on); document.body.classList.toggle('drive-on', on); }
  }, 1000);

  function render() {
    if (!state) return;
    if (state.buffering) { topEl.innerHTML = `<div class="empty">Lining up with your TV (${state.delaySeconds}s)…</div>`; restEl.innerHTML = ''; setPlay(''); return; }
    const pick = pickGame(state.games || {});
    if (!pick) {
      topEl.innerHTML = `<div class="empty">${wanted ? `No game found for ${esc(wanted)}.` : 'No games scheduled for the teams you follow.'}</div>`;
      restEl.innerHTML = '';
      setPlay('');
      document.body.style.setProperty('--field', '#0d1420');
      if (!tickerRunning) runTicker();
      return;
    }
    const [follow, g] = pick;
    featuredId = g.id;
    document.body.classList.toggle('field', g.kind === 'field');
    if (g.kind === 'field') return renderField(g);
    const featured = featuredTeam(follow, g);
    const football = /nfl|football|cfl|ufl/.test(g.league);
    document.body.classList.toggle('gridiron', fieldView && football && g.state !== 'pre');
    if (fieldView && football && g.state !== 'pre') return renderGridiron(g);
    if (logoView) return renderLogo(featured, g);
    if (sideView) return renderSide(g);
    document.body.style.setProperty('--field', darken(featured?.color, 0.16));
    document.body.style.setProperty('--accent', featured?.altColor || featured?.color || '#ffffff');
    topEl.innerHTML = statusBar(g) + teamBand(g.away, 'away', g) + teamBand(g.home, 'home', g) + situation(g);
    setPlay(g.state === 'in' ? g.lastPlay : '');
    setWithCountdown(restEl, middle(g) + (g.state === 'pre' ? '<div class="spacer"></div>' : '') +
      (online ? '' : '<footer class="foot"><span class="bad">Reconnecting to Game Day…</span></footer>'), g);
    if (!tickerRunning) runTicker();
  }


  // ---- Takeovers ---------------------------------------------------------
  // Score and win takeovers arrive on the same delay as the scoreboard, so they land with your TV.
  // ?sound=0 keeps a screen quiet (only one screen in the room should play sound).
  const soundOn = params.get('sound') !== '0';
  const tkoEl = document.getElementById('takeover');
  const bannerEl = document.getElementById('banner');
  let media = [];
  let current = null;   // the takeover on screen
  const queue = [];
  let bannerTimer = null;

  // How long each one stays up: at least `min`, longer if its sound or video runs on, never past `max`.
  const LENGTH = {
    touchdown: [10000, 45000], fieldgoal: [6000, 20000], safety: [7000, 20000], goal: [10000, 45000],
    win: [30000, 240000], anthem: [300000, 300000],
  };
  const WORDS = {
    touchdown: ['Touch', 'down'], fieldgoal: ['Field', 'goal'], safety: ['Safety'], goal: ['Goal'], win: ['Win'],
  };

  // A team's own file wins over the general one: KC-touchdown.mp4 before touchdown.mp4.
  function findMedia(moment, team) {
    const type = (f) => f.type || (f.video ? 'video' : 'audio');
    const pick = (t) => media.find((f) => f.moment === moment && f.team === team && type(f) === t)
      || media.find((f) => f.moment === moment && !f.team && type(f) === t);
    return { video: pick('video'), audio: pick('audio'), image: pick('image') };
  }
  // ?v= changes when a file is replaced, so screens never show an old copy from cache.
  const mediaUrl = (f) => `/media/${encodeURIComponent(f.name)}?v=${f.v || 0}`;
  // Your own logo for a team (BOS-logo.webp) wins over ESPN's, on every screen.
  function logoFor(t) {
    if (!t) return null;
    const own = media.find((f) => f.moment === 'logo' && f.team === t.abbr && f.type === 'image');
    return own ? mediaUrl(own) : t.logo;
  }

  // `team` names the side to show when it isn't the follow key itself (a game picked on the calendar).
  function teamsFor(follow, team) {
    const g = state && state.games && state.games[follow];
    const abbr = team || follow;
    const us = g && [g.home, g.away].find((t) => t && t.abbr === abbr);
    const them = g && [g.home, g.away].find((t) => t && t.abbr !== abbr);
    return { g, us, them };
  }

  function paint(el, t) {
    const c1 = bandColor(t || { color: '#2a3342' });
    const c2 = (t && (t.altColor && t.altColor !== c1 ? t.altColor : null)) || darken(c1, 0.6);
    el.style.setProperty('--t1', c1);
    el.style.setProperty('--t2', c2);
    el.style.setProperty('--t-ink', inkFor(c1));
    return [c1, c2];
  }

  function scoreLine(g) {
    if (!g || !g.away || !g.home) return '';
    const dim = (a, b) => (a.score < b.score ? ' class="dim"' : '');
    return `<div class="line"><span${dim(g.away, g.home)}>${esc(g.away.abbr)} ${g.away.score}</span><span${dim(g.home, g.away)}>${esc(g.home.abbr)} ${g.home.score}</span></div>`;
  }

  function flagHTML() {
    // 50 stars, 13 stripes, drawn here so there is no image to fetch.
    const W = 19, H = 10, cw = 7.6, ch = H * 7 / 13;
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><rect width="${W}" height="${H}" fill="#fff"/>`;
    for (let i = 0; i < 13; i += 2) svg += `<rect y="${(i * H) / 13}" width="${W}" height="${H / 13}" fill="#B22234"/>`;
    svg += `<rect width="${cw}" height="${ch}" fill="#3C3B6E"/>`;
    const r = 0.308, star = (x, y) => {
      const pts = [];
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + (k * Math.PI) / 5, rr = k % 2 ? r * 0.382 : r; pts.push(`${(x + rr * Math.cos(a)).toFixed(3)},${(y + rr * Math.sin(a)).toFixed(3)}`); }
      return `<polygon points="${pts.join(' ')}" fill="#fff"/>`;
    };
    for (let row = 0; row < 9; row++) {
      const y = ((row + 1) * ch) / 10;
      for (let k = 0; k < (row % 2 ? 5 : 6); k++) svg += star(((row % 2 ? 2 * k + 2 : 2 * k + 1) * cw) / 12, y);
    }
    svg += '</svg>';
    const url = `url('data:image/svg+xml,${encodeURIComponent(svg).replace(/'/g, '%27')}')`;
    const strips = 32;
    let html = '<div class="flag">';
    for (let i = 0; i < strips; i++) {
      html += `<i style="background-image:${url};background-position:${(-i * 88) / strips}vmin 0;animation-delay:${(-i * 0.09).toFixed(2)}s"></i>`;
    }
    return html + '</div>';
  }

  function confettiHTML(colors) {
    let html = '<div class="confetti">';
    for (let i = 0; i < 70; i++) {
      const c = [colors[0], colors[1], '#ffffff'][i % 3];
      html += `<i style="--c:${c};--x:${(Math.random() * 100).toFixed(1)}%;--d:${(2.6 + Math.random() * 2.4).toFixed(2)}s;--w:${(-Math.random() * 5).toFixed(2)}s;--r:${Math.round(360 + Math.random() * 720)}deg"></i>`;
    }
    return html + '</div>';
  }

  // Big words fill the width without running off the edge, whatever the team name or screen.
  function fitWord(el) {
    if (!el) return;
    const room = tkoEl.clientWidth * (logoView && !tkoEl.classList.contains('anthem') ? 0.44 : 0.92);
    const widest = Math.max(...[...el.children].map((s) => s.scrollWidth));
    if (widest > room) el.style.fontSize = `${(parseFloat(el.style.fontSize) * room) / widest}vmin`;
  }

  function playMedia(found, onEnded) {
    const els = [];
    const done = () => { if (onEnded) { const f = onEnded; onEnded = null; f(); } };
    const video = tkoEl.querySelector('video');
    if (video) {
      // A separate sound file plays over a video's own sound. Anthem videos stay quiet: the anthem is on TV.
      video.muted = !soundOn || !!found.audio || found.quiet === true;
      video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
      video.addEventListener('ended', done);
      els.push(video);
    }
    if (found.audio && soundOn) {
      const a = new Audio(`/media/${encodeURIComponent(found.audio.name)}`);
      a.play().catch(() => done());
      a.addEventListener('ended', done);
      a.addEventListener('error', done);
      els.push(a);
    }
    if (!els.length) done();
    return els;
  }

  function fadeOut(els) {
    for (const el of els) {
      const start = el.volume;
      let n = 0;
      const t = setInterval(() => { n++; el.volume = Math.max(0, start * (1 - n / 10)); if (n >= 10) { clearInterval(t); el.pause(); } }, 60);
    }
  }

  function showTakeover(item) {
    const { moment, follow } = item;
    const { g, us } = teamsFor(follow, item.team);
    const found = moment === 'anthem' ? findMedia('anthem', null) : findMedia(moment, item.team || follow);
    tkoEl.className = 'tko' + (moment === 'anthem' ? ' anthem' : '') + (found.video ? ' has-video' : '');
    const colors = paint(tkoEl, us);
    let html;
    if (moment === 'anthem') {
      // Your own flag (video or picture) if you uploaded one, otherwise the built-in waving flag.
      found.quiet = true;
      html = found.video ? `<video class="full" src="${mediaUrl(found.video)}" playsinline loop preload="auto"></video>`
        : found.image ? `<img class="full" src="${mediaUrl(found.image)}" alt="">`
        : `<div class="content">${flagHTML()}<div class="small">National Anthem</div></div>`;
    } else {
      const word = (WORDS[moment] || [moment]).map((w) => `<span>${esc(w)}</span>`).join('');
      const size = moment === 'win' ? 56 : moment === 'goal' ? 44 : 34; // shrunk to fit below if needed
      const visual = found.video
        ? `<video src="${mediaUrl(found.video)}" playsinline preload="auto"></video>`
        : found.image ? `<img class="logo" src="${mediaUrl(found.image)}" alt="">`
        : (logoFor(us) ? `<img class="logo" src="${esc(logoFor(us))}" alt="" onerror="this.remove()">` : '');
      const small = moment === 'win' ? `<div class="small">${esc((us && us.name) || follow)} win · Final</div>` : '';
      html = (moment === 'goal' ? '<div class="beacon"></div>' : '<div class="stripes"></div>') +
        (moment === 'win' ? confettiHTML(colors) : '') +
        `<div class="content">${found.video ? '' : visual}<div class="word" style="font-size:${size}vmin">${word}</div>${found.video ? visual : ''}${scoreLine(g)}${small}</div>` +
        '<div class="flash"></div>';
    }
    tkoEl.innerHTML = html;
    tkoEl.hidden = false;
    fitWord(tkoEl.querySelector('.word'));

    const [min, max] = LENGTH[moment] || [8000, 20000];
    const started = Date.now();
    let mediaDone = false;
    const finish = () => endTakeover(item);
    item.timers = [setTimeout(() => { if (mediaDone || !(found.audio || found.video)) finish(); }, min), setTimeout(finish, max)];
    item.els = playMedia(found, () => {
      mediaDone = true;
      if (Date.now() - started >= min) finish();
    });
    current = item;
  }

  function endTakeover(item, now) {
    if (current !== item) return;
    item.timers.forEach(clearTimeout);
    fadeOut(item.els || []);
    current = null;
    const next = () => {
      tkoEl.hidden = true; tkoEl.innerHTML = '';
      if (queue.length) showTakeover(queue.shift());
    };
    if (now) return next();
    tkoEl.classList.add('out');
    setTimeout(next, 600);
  }

  function startTakeover(item) {
    if (item.moment === 'anthem') { queue.length = 0; if (current) endTakeover(current, true); return showTakeover(item); }
    if (current) { if (queue.length < 4) queue.push(item); return; }
    showTakeover(item);
  }

  function showBanner(cls, big, sub, follow, moment, team) {
    if (current) return; // a takeover is up; the banner would only hide behind it
    clearTimeout(bannerTimer);
    const { us } = teamsFor(follow, team);
    paint(bannerEl, us);
    bannerEl.className = `banner ${cls}`;
    bannerEl.innerHTML = `<div class="stripes"></div><b>${esc(big)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}`;
    bannerEl.hidden = false;
    let els = [];
    if (moment) { const found = findMedia(moment, team || follow); if (found.audio) els = playMedia({ audio: found.audio }); }
    bannerTimer = setTimeout(() => {
      fadeOut(els);
      bannerEl.classList.add('out');
      bannerTimer = setTimeout(() => { bannerEl.hidden = true; }, 400);
    }, 5000);
  }

  function featuredFollow() {
    const pick = state && pickGame(state.games || {});
    return pick ? pick[0] : null;
  }

  function onGameEvent(ev) {
    if (params.get('takeovers') === '0') return; // a logos-only screen
    if (ev.type === 'anthem') return startTakeover({ moment: 'anthem', follow: featuredFollow() });
    if (ev.type === 'clear') {
      queue.length = 0;
      if (current) endTakeover(current);
      return;
    }
    if (!state || state.buffering) return;
    // Scores and 3rd downs: only for the game this screen is showing (tests always show).
    const mine = ev.test || ev.follow === featuredFollow();
    // Who the room cheers for: your team, or the side(s) picked on the calendar.
    const cheer = ev.cheerTeams || [ev.follow];
    if (ev.type === 'score' && (ev.kind === 'touchdown' || ev.kind === 'fieldgoal') && ev.follow === featuredFollow()) {
      scoreDriveUntil = Date.now() + 60000; // the drive chart shows the scoring drive for a minute
      scoringTeam = ev.team;
      setTimeout(render, 2500);
    }
    if (ev.type === 'score' && cheer.includes(ev.team) && mine) {
      if (ev.kind === 'twopoint') return showBanner('twopoint', '2-point', 'Conversion is good', ev.follow, null, ev.team);
      if (WORDS[ev.kind]) return startTakeover({ moment: ev.kind, follow: ev.follow, team: ev.team });
    }
    if (ev.type === 'third' && mine && cheer.length) {
      if (cheer.includes(ev.offense)) return showBanner('third', '3rd down', ev.text, ev.follow, null, ev.offense);
      return showBanner('defense', 'Defense', ev.text, ev.follow, 'defense', cheer[0]);
    }
    // A win: for any team you follow, and the side you picked in a calendar game.
    if (ev.type === 'final' && ev.winner && cheer.includes(ev.winner)) startTakeover({ moment: 'win', follow: ev.follow, team: ev.winner });
  }

  function connect() {
    const es = new EventSource('/stream');
    es.addEventListener('state', (e) => { state = JSON.parse(e.data); online = true; render(); });
    es.addEventListener('media', (e) => { media = JSON.parse(e.data); lpTeam = null; sdKey = null; render(); });
    // The new score reaches the screen right after its event; wait a beat so the takeover shows it.
    es.addEventListener('game', (e) => { const ev = JSON.parse(e.data); setTimeout(() => onGameEvent(ev), 150); });
    es.onopen = () => { online = true; };
    es.onerror = () => { online = false; render(); };
  }

  connect();
  // Keeps the pregame countdown ticking between data updates.
  setInterval(() => { if (state && !state.buffering) { const p = pickGame(state.games || {}); if (p && p[1].state === 'pre') render(); } }, 1000);
</script>
</body>
</html>
