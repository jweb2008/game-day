  // top to bottom; gains in team color, losses in red, the scoring play in gold.
  const giEl = document.getElementById('gridiron');
  let scoreDriveUntil = 0; // after a touchdown or field goal, show the scoring drive for a minute

  function giTeam(t, side, g) {
    if (!t) return '';
    const ball = g.state === 'in' && g.possession === t.id;
    const pic = logoFor(t) ? `<img src="${esc(logoFor(t))}" alt="" onerror="this.style.visibility='hidden'">` : '';
    const inner = side === 'away' ? `${pic}<span>${esc(t.abbr)}</span><span class="sc">${t.score}</span><span class="poss"></span>`
      : `<span class="poss"></span><span class="sc">${t.score}</span><span>${esc(t.abbr)}</span>${pic}`;
    return `<div class="gi-team ${side}${ball ? ' ball' : ''}">${inner}</div>`;
  }

  function fieldSVG(g, drive, offense, defense, scoring, H = 420, big = false) {
    const fs = big ? 46 : 26, ez = big ? 70 : 40, maxRow = big ? 60 : 30; // bigger marks for a TCL
    const W = 1200, X = (yte) => 100 + (100 - yte) * 10; // yards to end zone -> x
    const oc = bandColor(offense || {}), dc = bandColor(defense || {});
    let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`;
    svg += `<rect width="${W}" height="${H}" fill="#1f5b33"/>`;
    for (let i = 0; i < 10; i++) if (i % 2) svg += `<rect x="${100 + i * 100}" width="100" height="${H}" fill="#226338"/>`;
    svg += `<rect width="100" height="${H}" fill="${oc}" opacity=".85"/><rect x="1100" width="100" height="${H}" fill="${dc}" opacity=".85"/>`;
    svg += `<text x="50" y="${H / 2}" fill="${inkFor(oc)}" font-size="${ez}" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 50 ${H / 2})" font-family="Barlow Condensed, sans-serif">${esc(offense?.abbr || '')}</text>`;
    svg += `<text x="1150" y="${H / 2}" fill="${inkFor(dc)}" font-size="${ez}" font-weight="800" text-anchor="middle" dominant-baseline="middle" transform="rotate(90 1150 ${H / 2})" font-family="Barlow Condensed, sans-serif">${esc(defense?.abbr || '')}</text>`;
    for (let yd = 10; yd < 100; yd += 10) {
      const x = 100 + yd * 10, n = yd <= 50 ? yd : 100 - yd;
      svg += `<line x1="${x}" x2="${x}" y1="0" y2="${H}" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>`;
      svg += `<text x="${x}" y="${H - 14}" fill="#fff" fill-opacity=".55" font-size="${fs}" font-weight="700" text-anchor="middle" font-family="Barlow Condensed, sans-serif">${n}</text>`;
    }
    const plays = ((drive && drive.plays) || []).filter((p) => p.from != null && p.to != null);
    const shown = plays.slice(-12);
    const top = big ? 40 : 78, rowH = Math.min(maxRow, (H - top - (big ? 90 : 60)) / Math.max(shown.length, 6));
    shown.forEach((p, i) => {
      const x1 = X(p.from), x2 = X(p.to), y = top + i * rowH;
      const gain = p.to <= p.from;
      // Gains in the offense's color (white if it's too dark to see), lost yards gray, the score gold.
      const gainColor = luminance(oc) < 0.04 ? '#f5f3ee' : oc;
      const color = p.scoring ? '#ffd166' : gain ? gainColor : '#8b929c';
      const a = Math.min(x1, x2), w = Math.max(Math.abs(x2 - x1), 6);
      svg += `<rect x="${a}" y="${y}" width="${w}" height="${rowH * .62}" rx="${rowH * .3}" fill="${color}" stroke="#000" stroke-opacity=".25"/>`;
      svg += `<circle cx="${x2}" cy="${y + rowH * .31}" r="${rowH * .36}" fill="#fff"/>`;
    });
    // Line of scrimmage and the first-down line, from the live situation.
    if (!scoring && g.state === 'in' && g.yardsToEndzone != null) {
      const los = X(g.yardsToEndzone);
      svg += `<line x1="${los}" x2="${los}" y1="0" y2="${H}" stroke="#4f8cff" stroke-width="${big ? 10 : 6}"/>`;
      if (g.distance && g.distance < g.yardsToEndzone) {
        const fd = X(g.yardsToEndzone - g.distance);
        svg += `<line x1="${fd}" x2="${fd}" y1="0" y2="${H}" stroke="#ffd166" stroke-width="${big ? 10 : 6}"/>`;
      }
      svg += `<ellipse cx="${los}" cy="${H - (big ? 80 : 48)}" rx="${big ? 26 : 16}" ry="${big ? 16 : 10}" fill="#8b4a1c" stroke="#fff" stroke-width="2"/>`;
    }
    return svg + '</svg>';
  }

  function renderGridiron(g) {
    const d = g.drives || {};
    const scoring = Date.now() < scoreDriveUntil && d.lastScore;
    const drive = scoring ? d.lastScore : (d.current || d.last);
    const offAbbr = drive ? drive.team : null;
    const offense = [g.home, g.away].find((t) => t && (t.abbr === offAbbr || (!offAbbr && t.id === g.possession))) || g.away;
    const defense = offense === g.home ? g.away : g.home;
    const clock = g.state === 'post' ? (g.detail || 'Final') : statusBar(g).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    giEl.querySelector('.gi-bar').innerHTML = giTeam(g.away, 'away', g) +
      `<div class="gi-mid"><div class="clock">${esc(clock)}</div><div class="dd">${esc(g.state === 'in' && !scoring ? (g.downDistance || '') : '')}</div></div>` + giTeam(g.home, 'home', g);
    const label = scoring ? `<div class="gi-label score">Scoring drive · ${esc(offense.abbr)} · ${esc(d.lastScore.description || d.lastScore.result)}</div>`
      : drive ? `<div class="gi-label">${esc(offense.abbr)} drive${drive.description ? ' · ' + esc(drive.description) : ''}</div>` : '';
    giEl.querySelector('.gi-field').innerHTML = fieldSVG(g, drive, offense, defense, scoring) + label;
    const plays = (drive && drive.plays) || [];
    const last = plays[plays.length - 1];
    const text = last ? last.text : g.lastPlay || '';
    const faces = ((last && last.players) || []).map((p) => `<div class="gi-face">${p.headshot ? `<img src="${esc(p.headshot)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph'}))">` : '<span class="ph"></span>'}<span>${esc(p.short || p.name)}</span></div>`).join('');
    const sub = last ? [last.downText, last.clock && `${periodName({ ...g, period: last.period || g.period })} ${last.clock}`].filter(Boolean).join(' · ') : '';
    const html = `<div class="gi-faces">${faces}</div><div class="gi-text">${sub ? `<small>${esc(sub)}</small>` : ''}${esc(text)}</div>`;
    const playEl = giEl.querySelector('.gi-play');
    if (playEl._html !== html) { playEl._html = html; playEl.innerHTML = html; }
  }

  // ---- Team screens: stats and the drive chart take turns ----
  // ?panel=cycle (default) swaps every 5 minutes (?cycle=<seconds> to change it), the two TVs out of step so one shows the drive while
  // the other shows stats. ?panel=stats or ?panel=drive holds one. After a touchdown or field goal the
  // scoring team's screen shows the scoring drive for a minute.
  const panelMode = (params.get('panel') || 'cycle').toLowerCase();
  const CYCLE_MS = Math.max(10, Number(params.get('cycle')) || 300) * 1000;
  let scoringTeam = null;

  function panelShowsDrive(g, t) {
    if (Date.now() < scoreDriveUntil && g.drives && g.drives.lastScore) return scoringTeam === t.abbr;
    if (panelMode === 'drive') return true;
    if (panelMode === 'stats') return false;
    const phase = Math.floor(Date.now() / CYCLE_MS) % 2;
    return (phase === 0) === (sideView !== 'home');
  }

  // Headshots of the players named in the last play (passer, receiver, tackler), as on the field view.
  function sideFaces(play) {
    const list = (play.players || []).slice(0, 3);
    if (!list.length) return '';
    return '<div class="sd-faces">' + list.map((p) => `<div class="sd-face">${p.headshot ? `<img src="${esc(p.headshot)}" alt="" onerror="this.style.visibility='hidden'">` : '<i></i>'}<span>${esc(p.short || p.name)}</span></div>`).join('') + '</div>';
  }

  function sideDrive(g, t) {
    if (!/nfl|football|cfl|ufl/.test(g.league) || !g.drives) return '';
    const d = g.drives;
    const scoring = Date.now() < scoreDriveUntil && d.lastScore && scoringTeam === t.abbr;
    const drive = scoring ? d.lastScore : (d.current || d.last);
    if (!drive) return '';
    const offense = [g.home, g.away].find((x) => x && x.abbr === drive.team) || t;
    const defense = offense === g.home ? g.away : g.home;
    const plays = drive.plays || [];
    const last = plays[plays.length - 1];
    const title = scoring ? `Scoring drive · ${offense.abbr}` : `${offense.abbr} drive`;
    return `<div class="sd-drive-head${scoring ? ' score' : ''}">${esc(title)}<small>${esc(drive.description || '')}</small></div>` +
      `<div class="sd-field">${fieldSVG(g, drive, offense, defense, scoring, 800, true)}</div>` +
      (last ? `<div class="sd-drive-last">${sideFaces(last)}<div class="sd-drive-play">${esc(last.text)}</div></div>` : '');
  }

  // Top bar on the team screens: the left (away) TV shows the period and clock; the right (home)
  // TV shows down and distance while a football game is on, the period and clock otherwise.
  function sideStatus(g) {
    const football = /nfl|football|cfl|ufl/.test(g.league);
    if (sideView === 'home' && football && g.state === 'in' && g.downDistance) {
      const off = [g.home, g.away].find((x) => x && x.id === g.possession);
      return `<span class="when live">${esc(g.downDistance)}</span><span class="tv">${g.redZone ? '<b class="rz">Red zone</b> · ' : ''}${esc(off ? off.abbr + ' ball' : '')}</span>`;
    }
    return statusBar(g).replace(/^<header class="status">|<\/header>$/g, '');
  }

  // Hockey box score: this team's skaters (top scorers first) and its goalie, on its own screen.
  function sideBox(g, t) {
    if (/nfl|football|cfl|ufl/.test(g.league)) return '';
    const b = g.box && g.box[t.abbr];
    if (!b || !(b.skaters || []).length) return '';
    const hockey = /hockey|nhl/.test(g.league), hoops = /basketball|nba|wnba|nba-development/.test(g.league), baseball = /baseball|mlb|softball/.test(g.league);
    // Each sport's own columns, read by ESPN's column label.
    const COLS = hockey ? [['G', 'G'], ['A', 'A'], ['PTS', 'P'], ['SOG', 'SOG'], ['+/-', '+/-']]
      : hoops ? [['PTS', 'PTS'], ['REB', 'REB'], ['AST', 'AST'], ['FG', 'FG'], ['+/-', '+/-']]
      : baseball ? [['AB', 'AB'], ['R', 'R'], ['H', 'H'], ['RBI', 'RBI'], ['HR', 'HR']]
      : [];
    const val = (p, l) => (p.s && p.s[l] != null ? p.s[l] : l === 'SOG' ? p.SOG : l === 'PTS' ? p.PTS : l === '+/-' ? p.PM : p[l]);
    const cols = COLS.filter(([l]) => b.skaters.some((p) => val(p, l) != null && val(p, l) !== ''));
    const title = hockey ? 'skaters' : baseball ? 'batting' : 'players';
    const head = `<div class="bx-row head"><span>${esc(t.abbr)} ${title}</span>${cols.map(([, h]) => `<b>${h}</b>`).join('')}</div>`;
    const rows = b.skaters.slice(0, 14).map((p) => `<div class="bx-row${p.dnp ? ' dnp' : ''}"><span>${p.jersey ? `<small>${esc(p.jersey)}</small>` : ''}${esc(p.short || p.name)}</span>` +
      (p.dnp ? `<b class="dnp-note">DNP</b>` : cols.map(([l]) => `<b>${esc(val(p, l) ?? '')}</b>`).join('')) + '</div>').join('');
    const gk = (b.goalies || []).map((p) => `<div class="bx-goalie"><span>${esc(p.short || p.name)}</span><b>${esc(p.SV ?? '')}/${esc(p.SA ?? '')}</b><small>${p.SVP != null ? esc(p.SVP) + ' SV%' : ''}</small></div>`).join('');
    const pit = (b.pitchers || []).filter((p) => !p.dnp).map((p) => `<div class="bx-goalie"><span>${esc(p.short || p.name)}</span><b>${esc(p.s.IP ?? '')} IP</b><small>${esc([p.s.H != null && `${p.s.H} H`, p.s.ER != null && `${p.s.ER} ER`, p.s.K != null && `${p.s.K} K`].filter(Boolean).join(' · '))}</small></div>`).join('');
    const top = gk || pit;
    return `<div class="bx">${top ? `<div class="bx-gk">${top}</div>` : ''}${head}${rows}</div>`;
  }


  // Flip the panels on the beat without waiting for new data.
  if (sideView) setInterval(() => {
    const panes = document.querySelector('#side .sd-panes');
    if (!panes || !state) return;
    const pick = pickGame(state.games || {});
    if (!pick) return;
    const g = pick[1], t = g[sideView];
    if (t) { const on = panelShowsDrive(g, t); panes.classList.toggle('show-drive', on); document.body.classList.toggle('drive-on', on); }
  }, 1000);

  function render() {
    if (!state) return;
    if (state.buffering) { topEl.innerHTML = `<div class="empty">Lining up with your TV (${state.delaySeconds}s)…</div>`; restEl.innerHTML = ''; setPlay(''); return; }
    const pick = pickGame(state.games || {});
    if (!pick) {
      topEl.innerHTML = `<div class="empty">${wanted ? `No game found for ${esc(wanted)}.` : 'No games scheduled for the teams you follow.'}</div>`;
      restEl.innerHTML = '';
      setPlay('');
      document.body.style.setProperty('--field', '#0d1420');
      if (!tickerRunning) runTicker();
      return;
    }
    const [follow, g] = pick;
    featuredId = g.id;
    document.body.classList.toggle('field', g.kind === 'field');
    if (g.kind === 'field') return renderField(g);
    const featured = featuredTeam(follow, g);
    const football = /nfl|football|cfl|ufl/.test(g.league);
    document.body.classList.toggle('gridiron', fieldView && football && g.state !== 'pre');
    if (fieldView && football && g.state !== 'pre') return renderGridiron(g);
    if (logoView) return renderLogo(featured, g);
    if (sideView) return renderSide(g);
    document.body.style.setProperty('--field', darken(featured?.color, 0.16));
    document.body.style.setProperty('--accent', featured?.altColor || featured?.color || '#ffffff');
    topEl.innerHTML = statusBar(g) + teamBand(g.away, 'away', g) + teamBand(g.home, 'home', g) + situation(g);
    setPlay(g.state === 'in' ? g.lastPlay : '');
    setWithCountdown(restEl, middle(g) + (g.state === 'pre' ? '<div class="spacer"></div>' : '') +
      (online ? '' : '<footer class="foot"><span class="bad">Reconnecting to Game Day…</span></footer>'), g);
    if (!tickerRunning) runTicker();
  }


  // ---- Smooth game clock --------------------------------------------------
  // ESPN only sends a new clock reading every 10 to 15 seconds, so the clock jumped in chunks.
  // Each screen now counts the clock down itself between readings and corrects to each new one.
  // If the reading hasn't moved for a while the clock has stopped (whistle, timeout), so it holds
  // on ESPN's reading. Soccer and baseball are left alone (their clocks count up or don't exist).
  // How far to count past a reading is learned from how often ESPN's readings arrive (gap), so at a
  // whistle the clock overruns by at most one gap before settling back on the stopped time.
  const clockObs = {};       // game id -> { reading, sec, colon, at, moving }
  const M0 = '\uE000', M1 = '\uE001', M2 = '\uE002';
  const countdown = (g) => /nfl|football|cfl|ufl|hockey|nhl|basketball|nba|wnba|lacrosse|ncaa|nll|pll/.test(g.league || '') && !/soccer|baseball|mlb/.test(g.league || '');
  function parseClock(c) {
    let m = /^(\d+):(\d{2})$/.exec(c || '');
    if (m) return { sec: +m[1] * 60 + +m[2], colon: true };
    m = /^(\d+(?:\.\d+)?)$/.exec(c || '');
    return m ? { sec: +m[1], colon: false } : null;
  }
  function fmtClock(sec, colon) {
    if (!colon && sec < 60) return sec.toFixed(1);
    const t = Math.max(0, Math.ceil(sec));
    return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
  }
  function clockNow(id) {
    const o = clockObs[id];
    if (!o) return null;
    const run = (Date.now() - o.at) / 1000;
    const cap = Math.min(20, Math.max(5, o.gap + 1));
    if (!o.running || !o.moving || run >= cap + 4) return fmtClock(o.sec, o.colon);
    return fmtClock(Math.max(0, o.sec - Math.min(run, cap)), o.colon);
  }
  function smoothClocks(st) {
    const seen = new Set();
    for (const g of Object.values(st.games || {})) {
      if (!g || seen.has(g.id) || g.state !== 'in' || !countdown(g)) continue;
      seen.add(g.id);
      const p = parseClock(g.clock);
      if (!p) continue;
      const o = clockObs[g.id];
      const running = /IN_PROGRESS/.test(g.statusName || 'STATUS_IN_PROGRESS') && !onBreakish(g);
      if (!o || o.reading !== g.clock) {
        // Learn the gap between readings while the clock runs (ignore long gaps: those were stoppages).
        const gap = o && o.moving ? (Date.now() - o.at) / 1000 : null;
        const learned = o ? (gap && gap < 25 ? o.gap * 0.7 + gap * 0.3 : o.gap) : 15;
        clockObs[g.id] = { reading: g.clock, ...p, at: Date.now(), moving: !!o && running, running, gap: learned };
      }
      else o.running = running;
      // Swap ESPN's reading for a marked one the page turns into a ticking <span>.
      const mark = `${M0}${g.id}${M1}${clockNow(g.id)}${M2}`;
      if (g.detail && g.detail.includes(g.clock)) g.detail = g.detail.replace(g.clock, mark);
      g.clock = mark;
    }
    for (const id of Object.keys(clockObs)) if (!seen.has(id)) delete clockObs[id];
  }
  const onBreakish = (g) => /HALFTIME|END_PERIOD|INTERMISSION|DELAY|TIMEOUT/i.test(g.statusName || '') || /halftime|intermission|^end\b|end of/i.test(g.detail || '');
  const MARK = new RegExp(`${M0}([^${M1}]*)${M1}([^${M2}]*)${M2}`, 'g');
  function markClocks(root) {
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const hits = [];
    while (walk.nextNode()) if (walk.currentNode.nodeValue.includes(M0)) hits.push(walk.currentNode);
    for (const node of hits) {
      const text = node.nodeValue;
      if (node.parentNode && node.parentNode.closest && node.parentNode.closest('svg')) { node.nodeValue = text.replace(MARK, '$2'); continue; }
      const frag = document.createDocumentFragment();
      let last = 0;
      text.replace(MARK, (all, id, clock, at) => {
        if (at > last) frag.appendChild(document.createTextNode(text.slice(last, at)));
        const span = document.createElement('span');
        span.className = 'lclock'; span.dataset.g = id; span.textContent = clock;
        frag.appendChild(span);
        last = at + all.length;
        return all;
      });
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  }
  new MutationObserver((list) => {
    for (const m of list) for (const n of m.addedNodes) {
      if (n.nodeType === 3 ? n.nodeValue.includes(M0) : n.nodeType === 1 && n.textContent.includes(M0)) markClocks(n.nodeType === 3 ? n.parentNode : n);
    }
  }).observe(document.body, { childList: true, subtree: true });
  setInterval(() => {
    for (const el of document.querySelectorAll('.lclock')) {
      const v = clockNow(el.dataset.g);
      if (v && el.textContent !== v) el.textContent = v;
    }
  }, 250);

  // ---- Takeovers ---------------------------------------------------------
  // Score and win takeovers arrive on the same delay as the scoreboard, so they land with your TV.
  // ?sound=0 keeps a screen quiet (only one screen in the room should play sound).
  const soundOn = params.get('sound') !== '0';
  const tkoEl = document.getElementById('takeover');
  const bannerEl = document.getElementById('banner');
  let media = [];
  let current = null;   // the takeover on screen
  const queue = [];
  let bannerTimer = null;

  // How long each one stays up: at least `min`, longer if its sound or video runs on, never past `max`.
  const LENGTH = {
    touchdown: [10000, 45000], fieldgoal: [6000, 20000], safety: [7000, 20000], goal: [10000, 45000],
    win: [30000, 240000], anthem: [300000, 300000],
  };
  const WORDS = {
    touchdown: ['Touch', 'down'], fieldgoal: ['Field', 'goal'], safety: ['Safety'], goal: ['Goal'], win: ['Win'],
  };

  // A team's own file wins over the general one: KC-touchdown.mp4 before touchdown.mp4.
  // `league` keeps one team's files off another with the same abbreviation (Bruins and Celtics are both BOS).
  function findMedia(moment, team, league) {
    const type = (f) => f.type || (f.video ? 'video' : 'audio');
    const pick = (t) => media.find((f) => f.moment === moment && team && f.team === team && f.league === league && type(f) === t)
      || media.find((f) => f.moment === moment && !f.team && type(f) === t);
    return { video: pick('video'), audio: pick('audio'), image: pick('image') };
  }
  // ?v= changes when a file is replaced, so screens never show an old copy from cache.
  const mediaUrl = (f) => `/media/${encodeURIComponent(f.name)}?v=${f.v || 0}`;
  // Your own logo for a team (BOS-logo.webp) wins over ESPN's, on every screen.
  function logoFor(t) {
    if (!t) return null;
    const own = media.find((f) => f.moment === 'logo' && f.team === t.abbr && f.league === t.league && f.type === 'image');
    return own ? mediaUrl(own) : t.logo;
  }

  // `team` names the side to show when it isn't the follow key itself (a game picked on the calendar).
  function teamsFor(follow, team) {
    const g = state && state.games && state.games[follow];
    const abbr = team || follow;
    const us = g && [g.home, g.away].find((t) => t && t.abbr === abbr);
    const them = g && [g.home, g.away].find((t) => t && t.abbr !== abbr);
    return { g, us, them };
  }

  function paint(el, t) {
    const c1 = bandColor(t || { color: '#2a3342' });
    const c2 = (t && (t.altColor && t.altColor !== c1 ? t.altColor : null)) || darken(c1, 0.6);
    el.style.setProperty('--t1', c1);
    el.style.setProperty('--t2', c2);
    el.style.setProperty('--t-ink', inkFor(c1));
    return [c1, c2];
  }

  function scoreLine(g) {
    if (!g || !g.away || !g.home) return '';
    const dim = (a, b) => (a.score < b.score ? ' class="dim"' : '');
    return `<div class="line"><span${dim(g.away, g.home)}>${esc(g.away.abbr)} ${g.away.score}</span><span${dim(g.home, g.away)}>${esc(g.home.abbr)} ${g.home.score}</span></div>`;
  }

  function flagHTML() {
    // 50 stars, 13 stripes, drawn here so there is no image to fetch.
    const W = 19, H = 10, cw = 7.6, ch = H * 7 / 13;
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><rect width="${W}" height="${H}" fill="#fff"/>`;
    for (let i = 0; i < 13; i += 2) svg += `<rect y="${(i * H) / 13}" width="${W}" height="${H / 13}" fill="#B22234"/>`;
    svg += `<rect width="${cw}" height="${ch}" fill="#3C3B6E"/>`;
    const r = 0.308, star = (x, y) => {
      const pts = [];
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + (k * Math.PI) / 5, rr = k % 2 ? r * 0.382 : r; pts.push(`${(x + rr * Math.cos(a)).toFixed(3)},${(y + rr * Math.sin(a)).toFixed(3)}`); }
      return `<polygon points="${pts.join(' ')}" fill="#fff"/>`;
    };
    for (let row = 0; row < 9; row++) {
      const y = ((row + 1) * ch) / 10;
      for (let k = 0; k < (row % 2 ? 5 : 6); k++) svg += star(((row % 2 ? 2 * k + 2 : 2 * k + 1) * cw) / 12, y);
    }
    svg += '</svg>';
    const url = `url('data:image/svg+xml,${encodeURIComponent(svg).replace(/'/g, '%27')}')`;
    const strips = 32;
    let html = '<div class="flag">';
    for (let i = 0; i < strips; i++) {
      html += `<i style="background-image:${url};background-position:${(-i * 88) / strips}vmin 0;animation-delay:${(-i * 0.09).toFixed(2)}s"></i>`;
    }
    return html + '</div>';
  }

  function confettiHTML(colors) {
    let html = '<div class="confetti">';
    for (let i = 0; i < 70; i++) {
      const c = [colors[0], colors[1], '#ffffff'][i % 3];
      html += `<i style="--c:${c};--x:${(Math.random() * 100).toFixed(1)}%;--d:${(2.6 + Math.random() * 2.4).toFixed(2)}s;--w:${(-Math.random() * 5).toFixed(2)}s;--r:${Math.round(360 + Math.random() * 720)}deg"></i>`;
    }
    return html + '</div>';
  }

  // Big words fill the width without running off the edge, whatever the team name or screen.
  function fitWord(el) {
    if (!el) return;
    const room = tkoEl.clientWidth * (logoView && !tkoEl.classList.contains('anthem') ? 0.44 : 0.92);
    const widest = Math.max(...[...el.children].map((s) => s.scrollWidth));
    if (widest > room) el.style.fontSize = `${(parseFloat(el.style.fontSize) * room) / widest}vmin`;
  }

  function playMedia(found, onEnded) {
    const els = [];
    const done = () => { if (onEnded) { const f = onEnded; onEnded = null; f(); } };
    const video = tkoEl.querySelector('video');
    if (video) {
      // A separate sound file plays over a video's own sound. Anthem videos stay quiet: the anthem is on TV.
      video.muted = !soundOn || !!found.audio || found.quiet === true;
      video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
      video.addEventListener('ended', done);
      els.push(video);
    }
    if (found.audio && soundOn) {
      const a = new Audio(`/media/${encodeURIComponent(found.audio.name)}`);
      a.play().catch(() => done());
      a.addEventListener('ended', done);
      a.addEventListener('error', done);
      els.push(a);
    }
    if (!els.length) done();
    return els;
  }

  function fadeOut(els) {
    for (const el of els) {
      const start = el.volume;
      let n = 0;
      const t = setInterval(() => { n++; el.volume = Math.max(0, start * (1 - n / 10)); if (n >= 10) { clearInterval(t); el.pause(); } }, 60);
    }
  }

  // ---- Ice shatter (hockey goals) ----
  // A frosted sheet over the takeover cracks from one impact point, then breaks into shards that fly
  // off the screen. Canvas, not dozens of layers, so the TVs' small GPUs keep up.
  function shatterIce(host) {
    const W = host.clientWidth, H = host.clientHeight;
    if (!W || !H) return;
    const cv = document.createElement('canvas');
    cv.className = 'ice'; cv.width = W; cv.height = H;
    host.appendChild(cv);
    const ctx = cv.getContext('2d');
    const R = Math.hypot(W, H);
    const cx = W * (0.44 + Math.random() * 0.12), cy = H * (0.36 + Math.random() * 0.1);
    // Shards: wedges around the impact, cut into rings, each corner nudged so no two look alike.
    const spokes = 14, rings = [0, 0.06, 0.16, 0.34, 0.62, 1.05].map((r) => r * R);
    const ang = Array.from({ length: spokes }, (_, i) => ((i + 0.5 * Math.random()) / spokes) * Math.PI * 2);
    const pt = (a, r) => [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    const jit = rings.map((r, k) => ang.map(() => (k ? r * (0.85 + Math.random() * 0.3) : 0)));
    const shards = [];
    for (let k = 0; k < rings.length - 1; k++) {
      for (let i = 0; i < spokes; i++) {
        const j = (i + 1) % spokes, a1 = ang[i], a2 = ang[j] + (j === 0 ? Math.PI * 2 : 0);
        const poly = k === 0 ? [[cx, cy], pt(a1, jit[1][i]), pt(a2, jit[1][j])]
          : [pt(a1, jit[k][i]), pt(a1, jit[k + 1][i]), pt(a2, jit[k + 1][j]), pt(a2, jit[k][j])];
        const mx = poly.reduce((s, p) => s + p[0], 0) / poly.length, my = poly.reduce((s, p) => s + p[1], 0) / poly.length;
        const dx = mx - cx, dy = my - cy, d = Math.hypot(dx, dy) || 1;
        const speed = (0.75 - k * 0.08) * R * (0.7 + Math.random() * 0.6); // inner pieces fly hardest
        shards.push({ poly, mx, my, vx: (dx / d) * speed, vy: (dy / d) * speed, spin: (Math.random() - 0.5) * 9, tint: 0.82 + Math.random() * 0.18 });
      }
    }
    // Cracks: jagged lines out from the impact, plus a ring of hairlines.
    const cracks = ang.map((a, i) => {
      const pts = [[cx, cy]];
      for (let r = R * 0.04; r < R * 0.75; r += R * (0.04 + Math.random() * 0.05)) pts.push(pt(a + (Math.random() - 0.5) * 0.12, r));
      return pts;
    });
    const sheet = (x0, y0, x1, y1) => {
      const g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, 'rgba(232,246,255,0.94)'); g.addColorStop(0.5, 'rgba(196,226,246,0.9)'); g.addColorStop(1, 'rgba(238,248,255,0.95)');
      return g;
    };
    const fill = sheet(0, 0, W, H);
    // Skate scratches, drawn once and reused as a pattern so every shard carries its own bit of the ice.
    const tex = document.createElement('canvas'); tex.width = W; tex.height = H;
    const tx = tex.getContext('2d');
    tx.fillStyle = fill; tx.fillRect(0, 0, W, H);
    tx.strokeStyle = 'rgba(255,255,255,0.55)'; tx.lineWidth = Math.max(1, W / 500);
    for (let i = 0; i < 26; i++) {
      const x = Math.random() * W, y = Math.random() * H, len = (0.2 + Math.random() * 0.5) * W, a = -0.4 + Math.random() * 0.8;
      tx.beginPath(); tx.moveTo(x, y); tx.quadraticCurveTo(x + len * 0.5, y + Math.sin(a) * len * 0.3, x + Math.cos(a) * len, y + Math.sin(a) * len); tx.stroke();
    }
    const pattern = ctx.createPattern(tex, 'no-repeat');
    const CRACK = 320, FLY = 1100, t0 = performance.now();
    const path = (poly) => { ctx.beginPath(); ctx.moveTo(poly[0][0], poly[0][1]); for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]); ctx.closePath(); };
    const frame = (now) => {
      const t = now - t0;
      ctx.clearRect(0, 0, W, H);
      if (t < CRACK) {
        // Hit and crack: the sheet shudders, cracks run out from the impact.
        const p = t / CRACK, shake = (1 - p) * W * 0.012;
        ctx.save(); ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        ctx.fillStyle = pattern; ctx.fillRect(-W * 0.05, -H * 0.05, W * 1.1, H * 1.1);
        ctx.strokeStyle = 'rgba(70,120,160,0.85)'; ctx.lineWidth = Math.max(1.5, W / 320); ctx.lineJoin = 'round';
        for (const c of cracks) {
          const n = Math.max(2, Math.ceil(c.length * Math.min(1, p * 1.6)));
          ctx.beginPath(); ctx.moveTo(c[0][0], c[0][1]); for (let i = 1; i < n; i++) ctx.lineTo(c[i][0], c[i][1]); ctx.stroke();
        }
        const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.18);
        glow.addColorStop(0, 'rgba(255,255,255,0.95)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glow; ctx.fillRect(cx - W * 0.2, cy - W * 0.2, W * 0.4, W * 0.4);
        ctx.restore();
      } else {
        // Break: every shard flies out and spins, falling a little, fading at the end.
        const s = Math.min(1, (t - CRACK) / FLY), e = 1 - Math.pow(1 - s, 2.2), alpha = 1 - Math.pow(s, 1.6);
        for (const sh of shards) {
          ctx.save();
          ctx.globalAlpha = alpha * sh.tint;
          ctx.translate(sh.mx + sh.vx * e, sh.my + sh.vy * e + H * 0.35 * s * s);
          ctx.rotate(sh.spin * e);
          ctx.translate(-sh.mx, -sh.my);
          path(sh.poly);
          ctx.fillStyle = pattern; ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = Math.max(1, W / 450); ctx.stroke();
          ctx.restore();
        }
      }
      if (t < CRACK + FLY && cv.isConnected) requestAnimationFrame(frame); else cv.remove();
    };
    requestAnimationFrame(frame);
    if (soundOn) iceSound(CRACK);
  }

  // A crack and a burst of breaking ice, made on the spot (no file needed). Under any goal horn you upload.
  function iceSound(breakAt) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ac = iceSound.ac || (iceSound.ac = new AC());
      if (ac.state === 'suspended') ac.resume();
      const burst = (at, len, freq, gain) => {
        const n = Math.floor(ac.sampleRate * len), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3) * (Math.random() < 0.08 ? 1 : 0.45);
        const src = ac.createBufferSource(); src.buffer = buf;
        const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = freq;
        const g = ac.createGain(); g.gain.value = gain;
        src.connect(hp); hp.connect(g); g.connect(ac.destination);
        src.start(ac.currentTime + at);
      };
      burst(0, 0.09, 1800, 0.5);               // the hit
      burst(breakAt / 1000, 0.7, 2600, 0.6);   // the sheet breaking
      burst(breakAt / 1000 + 0.12, 0.5, 4200, 0.35);
    } catch { /* no sound, no problem */ }
  }

  // ---- Player card: who scored, at replay time ----
  const pcardEl = document.getElementById('pcard');
  let pcardTimer = null;
  function showPlayerCard(ev, tries = 0) {
    if (logoView) return;
    // A takeover still up (a long goal song): wait for it, then show the card.
    if (current) { if (tries < 60) setTimeout(() => showPlayerCard(ev, tries + 1), 1000); return; }
    const p = ev.play && ev.play.scorer;
    if (!p) return;
    const { us } = teamsFor(ev.follow, ev.team);
    paint(pcardEl, us);
    const initials = (p.name || '').split(' ').map((w) => w[0] || '').join('').replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase();
    const pic = p.headshot ? `<img src="${esc(p.headshot)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${initials}'}))">` : `<div class="ph">${esc(initials)}</div>`;
    const tag = { goal: 'Goal scorer', touchdown: 'Touchdown', fieldgoal: 'Field goal', safety: 'Safety' }[ev.kind] || 'Scoring play';
    pcardEl.className = 'pcard';
    pcardEl.innerHTML = `<div class="stripes"></div>${pic}<div class="who"><small>${esc(tag)}${p.pos ? ` · ${esc(p.pos)}` : ''}</small><b>${esc(p.name)}</b>` +
      `${ev.play.how ? `<span>${esc(ev.play.how)}</span>` : ''}${ev.line ? `<span class="stat">${esc(ev.line)}</span>` : ''}</div>`;
    pcardEl.hidden = false;
    clearTimeout(pcardTimer);
    pcardTimer = setTimeout(() => {
      pcardEl.classList.add('out');
      pcardTimer = setTimeout(() => { pcardEl.hidden = true; }, 450);
    }, Math.max(4, Number(params.get('cardsecs')) || 12) * 1000);
  }

  function showTakeover(item) {
    const { moment, follow } = item;
    const { g, us } = teamsFor(follow, item.team);
    const found = moment === 'anthem' ? findMedia('anthem', null) : findMedia(moment, item.team || follow, g && g.league);
    const ice = moment === 'goal' && !logoView && params.get('ice') !== '0';
    tkoEl.className = 'tko' + (moment === 'anthem' ? ' anthem' : '') + (found.video ? ' has-video' : '') + (ice ? ' shatter' : '');
    const colors = paint(tkoEl, us);
    let html;
    if (moment === 'anthem') {
      // Your own flag (video or picture) if you uploaded one, otherwise the built-in waving flag.
      found.quiet = true;
      html = found.video ? `<video class="full" src="${mediaUrl(found.video)}" playsinline loop preload="auto"></video>`
        : found.image ? `<img class="full" src="${mediaUrl(found.image)}" alt="">`
        : `<div class="content">${flagHTML()}<div class="small">National Anthem</div></div>`;
    } else {
      const word = (WORDS[moment] || [moment]).map((w) => `<span>${esc(w)}</span>`).join('');
      const size = moment === 'win' ? 56 : moment === 'goal' ? 44 : 34; // shrunk to fit below if needed
      const visual = found.video
        ? `<video src="${mediaUrl(found.video)}" playsinline preload="auto"></video>`
        : found.image ? `<img class="logo" src="${mediaUrl(found.image)}" alt="">`
        : (logoFor(us) ? `<img class="logo" src="${esc(logoFor(us))}" alt="" onerror="this.remove()">` : '');
      const small = moment === 'win' ? `<div class="small">${esc((us && us.name) || follow)} win · Final</div>` : '';
      html = (moment === 'goal' ? '<div class="beacon"></div>' : '<div class="stripes"></div>') +
        (moment === 'win' ? confettiHTML(colors) : '') +
        `<div class="content">${found.video ? '' : visual}<div class="word" style="font-size:${size}vmin">${word}</div>${found.video ? visual : ''}${scoreLine(g)}${small}</div>` +
        '<div class="flash"></div>';
    }
    tkoEl.innerHTML = html;
    tkoEl.hidden = false;
    fitWord(tkoEl.querySelector('.word'));
    if (ice) shatterIce(tkoEl);

    const [min, max] = LENGTH[moment] || [8000, 20000];
    const started = Date.now();
    let mediaDone = false;
    const finish = () => endTakeover(item);
    item.timers = [setTimeout(() => { if (mediaDone || !(found.audio || found.video)) finish(); }, min), setTimeout(finish, max)];
    item.els = playMedia(found, () => {
      mediaDone = true;
      if (Date.now() - started >= min) finish();
    });
    current = item;
  }

  function endTakeover(item, now) {
    if (current !== item) return;
    item.timers.forEach(clearTimeout);
    fadeOut(item.els || []);
    current = null;
    const next = () => {
      tkoEl.hidden = true; tkoEl.innerHTML = '';
      if (queue.length) showTakeover(queue.shift());
    };
    if (now) return next();
    tkoEl.classList.add('out');
    setTimeout(next, 600);
  }

  function startTakeover(item) {
    if (item.moment === 'anthem') { queue.length = 0; if (current) endTakeover(current, true); return showTakeover(item); }
    if (current) { if (queue.length < 4) queue.push(item); return; }
    showTakeover(item);
  }

  function showBanner(cls, big, sub, follow, moment, team) {
    if (current) return; // a takeover is up; the banner would only hide behind it
    clearTimeout(bannerTimer);
    const { us } = teamsFor(follow, team);
    paint(bannerEl, us);
    bannerEl.className = `banner ${cls}`;
    bannerEl.innerHTML = `<div class="stripes"></div><b>${esc(big)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}`;
    bannerEl.hidden = false;
    let els = [];
    if (moment) { const fg = state && state.games && state.games[follow]; const found = findMedia(moment, team || follow, fg && fg.league); if (found.audio) els = playMedia({ audio: found.audio }); }
    bannerTimer = setTimeout(() => {
      fadeOut(els);
      bannerEl.classList.add('out');
      bannerTimer = setTimeout(() => { bannerEl.hidden = true; }, 400);
    }, 5000);
  }

  function featuredFollow() {
    const pick = state && pickGame(state.games || {});
    return pick ? pick[0] : null;
  }

  function onGameEvent(ev) {
    if (params.get('takeovers') === '0') return; // a logos-only screen
    if (ev.type === 'anthem') return startTakeover({ moment: 'anthem', follow: featuredFollow() });
    if (ev.type === 'clear') {
      queue.length = 0;
      if (current) endTakeover(current);
      return;
    }
    if (!state || state.buffering) return;
    // Scores and 3rd downs: only for the game this screen is showing (tests always show).
    const mine = ev.test || ev.follow === featuredFollow();
    // Who the room cheers for: your team, or the side(s) picked on the calendar.
    const cheer = ev.cheerTeams || [ev.follow];
    if (ev.type === 'score' && (ev.kind === 'touchdown' || ev.kind === 'fieldgoal') && ev.follow === featuredFollow()) {
      scoreDriveUntil = Date.now() + 60000; // the drive chart shows the scoring drive for a minute
      scoringTeam = ev.team;
      setTimeout(render, 2500);
    }
    if (ev.type === 'score' && cheer.includes(ev.team) && mine) {
      if (ev.kind === 'twopoint') return showBanner('twopoint', '2-point', 'Conversion is good', ev.follow, null, ev.team);
      if (WORDS[ev.kind]) return startTakeover({ moment: ev.kind, follow: ev.follow, team: ev.team, play: ev.play });
    }
    if (ev.type === 'scorer' && cheer.includes(ev.team) && mine) return showPlayerCard(ev);
    if (ev.type === 'third' && mine && cheer.length) {
      if (cheer.includes(ev.offense)) return showBanner('third', '3rd down', ev.text, ev.follow, null, ev.offense);
      return showBanner('defense', 'Defense', ev.text, ev.follow, 'defense', cheer[0]);
    }
    // A win: for any team you follow, and the side you picked in a calendar game.
    if (ev.type === 'final' && ev.winner && cheer.includes(ev.winner)) startTakeover({ moment: 'win', follow: ev.follow, team: ev.winner });
  }

  // ---- Score alerts on the ticker: another game's score changed ----
  const alertEl = document.getElementById('tickalert');
  const alerts = [];
  let alertBusy = false;
  function scoreAlert(a) {
    if (logoView || a.id === featuredId) return; // the game on screen has its own takeovers
    alerts.push(a);
    if (alerts.length > 6) alerts.shift();
    if (!alertBusy) nextAlert();
  }
  function nextAlert() {
    const a = alerts.shift();
    if (!a) { alertBusy = false; alertEl.hidden = true; return; }
    alertBusy = true;
    const side = (t) => `<span class="sc${t.abbr === a.scorer ? '' : ' dim'}">${esc(t.abbr)} ${t.score}</span>`;
    // A run or a lead change leads with what happened; the score comes after, smaller.
    alertEl.innerHTML = a.note
      ? `<span class="tag">${esc(a.tag || 'ALERT')}</span><span class="nt">${esc(a.note)}</span><small>${esc(`${a.away.abbr} ${a.away.score} · ${a.home.abbr} ${a.home.score}`)}</small>`
      : `<span class="tag">SCORE</span>${side(a.away)}${side(a.home)}<small>${esc(a.detail || '')}</small>`;
    alertEl.hidden = false;
    alertEl.style.animation = 'none'; void alertEl.offsetWidth; alertEl.style.animation = '';
    setTimeout(nextAlert, 8000);
  }

  function connect() {
    const es = new EventSource('/stream');
    es.addEventListener('state', (e) => { state = JSON.parse(e.data); online = true; smoothClocks(state); render(); });
    es.addEventListener('media', (e) => { media = JSON.parse(e.data); lpTeam = null; sdKey = null; render(); });
    // The new score reaches the screen right after its event; wait a beat so the takeover shows it.
    es.addEventListener('game', (e) => { const ev = JSON.parse(e.data); setTimeout(() => onGameEvent(ev), 150); });
    es.addEventListener('alert', (e) => scoreAlert(JSON.parse(e.data)));
    es.onopen = () => { online = true; };
    es.onerror = () => { online = false; render(); };
  }

  connect();
  // Keeps the pregame countdown ticking between data updates.
  setInterval(() => { if (state && !state.buffering) { const p = pickGame(state.games || {}); if (p && p[1].state === 'pre') render(); } }, 1000);
</script>
</body>
</html>
